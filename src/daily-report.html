<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b0c">
<script id="early">document.documentElement.dataset.ui=innerWidth>=980?'desktop':'mobile'</script>
<meta name="app-version" content="1.1">
<title>บันทึกควบคุมงานประจำวัน (Daily Report)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DESIGN SYSTEM v2  ·  มืด + เขียวเทอร์ควอยซ์ / กรมท่า
   มาตราส่วน: ระยะห่าง 4·8·12·16·20·24·32 · มุมโค้ง 12/16/24/pill
   ความสูงควบคุม 48 (หลัก) / 40 (รอง) / 36 (ชิป) · ตัวอักษร 12/13/15/17/20/24/30/40
   ===================================================================== */
:root{
  --ink:#eef4f2; --muted:#9db0ab; --faint:#6b7c78;
  --bg:#06090a; --surface:#0f1517; --surface2:#141b1d; --field:#0a0f10; --card:#0f1517;
  --line:#1f292c; --line2:#2d3a3d;
  --tq:#00a57d; --accent:#1ccaa3; --accent-soft:rgba(28,202,163,.13); --accent-line:rgba(28,202,163,.42); --on-accent:#03140f;
  --navy:#14304f;
  --grad:linear-gradient(135deg,#00a57d 0%,#0b7f8e 55%,#14304f 100%);
  --done:#3fd8b0; --done-soft:rgba(63,216,176,.14); --warn:#e6b25f; --warn-soft:rgba(230,178,95,.14);
  --fast:#74aef5; --fast-soft:rgba(116,174,245,.14); --danger:#f08c8c;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px;
  --r-s:12px; --r-m:16px; --r-l:24px; --r-p:999px;
  --h-ctl:48px; --h-sm:40px; --h-chip:36px;
  --gut:20px;
  --font:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun','Tahoma',sans-serif;
  --fz:1;
  --fs-1:calc(12px*var(--fz)); --fs-2:calc(13px*var(--fz)); --fs-3:calc(15px*var(--fz)); --fs-4:calc(17px*var(--fz));
  --fs-5:calc(20px*var(--fz)); --fs-6:calc(24px*var(--fz)); --fs-7:calc(30px*var(--fz)); --fs-8:calc(40px*var(--fz));
}
html.fsar{--fz:1.16;--font:'TH Sarabun New','THSarabun','Sarabun','Noto Sans Thai','Tahoma',sans-serif}
*{box-sizing:border-box}
html{color-scheme:dark;background:var(--bg);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-3);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font-family:inherit}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-0.14em}
:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px}
::placeholder{color:var(--faint);opacity:1}
.muted{color:var(--muted);font-weight:300;font-size:var(--fs-2);margin:0 0 var(--s3)}
.sm-note{margin:var(--s2) 0 0;color:var(--muted);font-size:var(--fs-1);font-weight:300;line-height:1.55}
.grow{flex:1;min-width:0}

/* ---------- ปุ่ม ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--h-ctl);padding:10px 22px;border:0;border-radius:var(--r-p);font:inherit;font-size:var(--fs-3);font-weight:500;line-height:1.3;text-align:center;background:var(--grad);color:#fff;cursor:pointer;box-shadow:0 8px 22px rgba(0,165,125,.16)}
.btn svg{font-size:20px}
.btn.sm{min-height:var(--h-sm);padding:7px 16px;font-size:var(--fs-2)}
.btn.sm svg{font-size:18px}
.btn.ghost{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:wait}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--muted);display:inline-grid;place-items:center;font-size:20px;padding:0;cursor:pointer;flex:none}
.ib:hover{color:var(--ink);border-color:var(--accent-line)}
.ib.danger{color:var(--danger)}
.ib.ghost{border-color:transparent}

/* ---------- ฟอร์ม ---------- */
.fl{display:block;margin-bottom:var(--s4)}
.fl>span{display:block;font-size:var(--fs-2);color:var(--muted);margin-bottom:6px}
:where(.cbody) :where(input:not([type=checkbox]):not([type=file]),textarea,select),.inp{display:block;width:100%;min-height:var(--h-ctl);padding:12px 16px;font:inherit;font-size:var(--fs-3);line-height:1.4;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:var(--r-m);outline:0;resize:none}
:where(.cbody) :where(input,textarea,select):focus,.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.chk{display:flex;gap:var(--s2);align-items:center;font-size:var(--fs-2);margin:var(--s3) 0 var(--s1);color:var(--muted)}
.chk input{width:18px;height:18px;accent-color:var(--tq)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin:var(--s3) 0}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:var(--h-chip);padding:6px 14px;font:inherit;font-size:var(--fs-2);line-height:1.3;color:var(--ink);background:transparent;border:1px solid var(--line2);border-radius:var(--r-p);cursor:pointer;overflow-wrap:anywhere}
.chip small{color:var(--faint);font-size:var(--fs-1)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
.chip.on small{color:var(--accent)}
.chip .x{color:var(--faint);font-style:normal;padding:0 2px}
.rowbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin:var(--s3) 0 0;flex-wrap:wrap}
.total{font-size:var(--fs-3);color:var(--muted)} .total b{color:var(--ink);font-size:var(--fs-5);font-weight:600}
.ss{display:inline-flex;align-items:center;gap:var(--s1);white-space:nowrap;font-size:var(--fs-1);font-weight:400}
.ss.ok{color:var(--done)}.ss.wait{color:var(--muted)}.ss.err{color:var(--danger);font-weight:500}
.spill{display:inline-flex;align-items:center;border-radius:var(--r-p);padding:2px 12px;font-size:var(--fs-1);font-weight:500;line-height:1.5}
.spill.normal{background:var(--done-soft);color:var(--done)}.spill.fast{background:var(--fast-soft);color:var(--fast)}.spill.slow{background:var(--warn-soft);color:var(--warn)}
.stbox,.note-box,.sub{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-m);padding:var(--s3) var(--s4);font-size:var(--fs-2);line-height:1.7;margin:var(--s3) 0;overflow-wrap:anywhere}
.stbox b,.note-box b{font-weight:600}
.stbox .btn{margin-top:var(--s2)}

/* ---------- การ์ดหัวข้อ ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:var(--s5);margin-bottom:var(--s4);scroll-margin-top:92px;overflow-wrap:anywhere}
.ch{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.ci{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:20px;flex:none}
.ch h2{margin:0;flex:1;min-width:0;font-size:var(--fs-4);font-weight:500;line-height:1.35}
.ch .eye{width:36px;height:36px;font-size:18px;border-color:transparent}
.cbody>:last-child{margin-bottom:0}

/* โลโก้ */
.logo-row{display:flex;flex-wrap:wrap;gap:var(--s4);align-items:center;margin-bottom:var(--s4)}
.logo-row .grow{min-width:min(100%,200px)}
.logo-row .btn{margin:0 var(--s2) var(--s2) 0;justify-content:flex-start;text-align:left}
.logo-box{width:96px;height:72px;border:1px dashed var(--line2);border-radius:var(--r-m);display:grid;place-items:center;color:#7b868a;font-size:28px;overflow:hidden;background:#fff;flex:none}
.logo-box img{max-width:100%;max-height:100%;width:auto;height:auto;display:block}

/* วันที่ */
.dctl{display:flex;gap:var(--s2);align-items:stretch}
.dctl .ib{height:auto;min-height:var(--h-ctl);width:48px;border-radius:var(--r-m);font-size:22px}
.dbig{position:relative;flex:1;border:1px solid var(--line);border-radius:var(--r-m);display:grid;place-items:center;padding:var(--s3);min-height:var(--h-ctl);background:var(--field);cursor:pointer;text-align:center}
.dbig span{font-weight:500;font-size:var(--fs-4)}
.dbig input{position:absolute!important;inset:0;width:100%!important;height:100%;min-height:0!important;opacity:0;cursor:pointer;border:0!important;padding:0!important}
.dinfo{margin-top:var(--s3);color:var(--muted);font-size:var(--fs-2);font-weight:300}
.dinfo b{color:var(--accent);font-weight:600}

/* สภาพอากาศ */
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.wopt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:var(--s3) 6px;font:inherit;font-size:var(--fs-2);line-height:1.3;text-align:center;border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:var(--r-m);cursor:pointer;overflow-wrap:anywhere}
.wopt svg{font-size:26px}
.wopt.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
.sl-t{font-size:var(--fs-2);color:var(--accent);font-weight:500;display:flex;gap:6px;align-items:center}

/* แถวข้อมูล */
.wf{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-bottom:var(--s3)}
.wf .r{flex:1 1 150px;min-width:0}
.stp{display:flex;align-items:center;gap:6px;flex:none}
.cbody .stp input{width:60px;min-height:var(--h-sm);padding:6px 4px;text-align:center}
.mat,.wk,.sgc,.pc,.bqi{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-m);padding:var(--s3) var(--s4);margin-bottom:var(--s3)}
.mat .n{margin-bottom:var(--s2)}
.mrow{display:grid;grid-template-columns:96px 84px 1fr 40px;gap:var(--s2);align-items:center}
.mrow2{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s2) 0;border-bottom:1px solid var(--line)}
.mrow2 .mn{font-size:var(--fs-3)}
.addm{display:flex;gap:var(--s2);margin-top:var(--s3)}
.wk{display:flex;gap:var(--s3);align-items:flex-start}
.wk-n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:var(--fs-1);font-weight:500;display:grid;place-items:center;flex:none;margin-top:12px}
.wk .m2{display:grid;grid-template-columns:1fr 96px;gap:var(--s2);margin-top:var(--s2)}
.pct{position:relative}
.pct span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:var(--fs-2);pointer-events:none}
.cbody .pct input{padding-right:30px}
details.sug{margin:var(--s3) 0 0}
details.sug summary{cursor:pointer;color:var(--accent);font-size:var(--fs-2);font-weight:500;padding:var(--s1) 0}
.sug .lt{font-size:var(--fs-1);color:var(--muted);margin-top:var(--s2)}

/* ความก้าวหน้า */
.prg{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-bottom:var(--s4)}
.pr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:var(--s3) 6px;font:inherit;font-size:var(--fs-2);text-align:center;line-height:1.3;border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:var(--r-m);cursor:pointer;overflow-wrap:anywhere}
.pr svg{font-size:24px}
.pr.on.normal{background:var(--done-soft);border-color:var(--done);color:var(--done);font-weight:500}
.pr.on.fast{background:var(--fast-soft);border-color:var(--fast);color:var(--fast);font-weight:500}
.pr.on.slow{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:500}

/* รูปภาพ */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3);margin-bottom:var(--s4)}
.pc{padding:var(--s2);margin:0}
.pc .pi{height:128px;background:#05090a;border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:var(--s2)}
.pc .pi img{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
.pc .bt{display:flex;gap:6px;margin-top:var(--s2)}
.pc .bt .ib{width:34px;height:34px;font-size:17px}
.pc .bt .sp1{flex:1}
.cbody .pc input{min-height:var(--h-sm);padding:6px 12px;font-size:var(--fs-2)}

/* ลายเซ็น */
.sgr{margin-bottom:var(--s5)}
.cbody .sgr>.lbl{display:block;width:100%;min-height:0;font:inherit;font-size:var(--fs-3);font-weight:500;color:var(--accent);background:transparent;border:0;border-bottom:1px dashed var(--line2);border-radius:0;padding:4px 0;margin-bottom:var(--s3);box-shadow:none}
.sgc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s2)}
.sgc-h small{color:var(--muted);font-size:var(--fs-1)}
.sgc-h .ib{width:34px;height:34px;font-size:17px}
.sg-box{height:96px;border:1px dashed var(--line2);border-radius:var(--r-s);background:#fff;display:flex;align-items:center;justify-content:center;color:#7b868a;font-size:var(--fs-2);gap:var(--s2);cursor:pointer;overflow:hidden;margin:var(--s2) 0 var(--s3)}
.sg-box img{max-width:92%;max-height:86px;width:auto;height:auto;display:block}
.sgc .g2{margin-bottom:0}
.sgc .bts{display:flex;gap:var(--s2);flex-wrap:wrap}
.hint{display:flex;gap:var(--s2);color:var(--faint);font-size:var(--fs-1);font-weight:300;margin:var(--s6) 0 0;line-height:1.6}

/* ---------- หน้าต่างย่อย ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.68);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.panel{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:var(--s3) var(--gut) var(--s7);overflow-wrap:anywhere}
.panel::before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto var(--s3)}
@media (min-width:600px){.modal{align-items:center;padding:var(--s6)}.panel{border-radius:28px;border-bottom:1px solid var(--line);padding:var(--s6)}.panel::before{display:none}}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.m-head h3{margin:0;font-size:var(--fs-5);font-weight:600;line-height:1.35}
.panel h4{margin:var(--s6) 0 var(--s2);font-size:var(--fs-2);font-weight:500;color:var(--muted)}
.acts{display:grid;gap:var(--s2)}
.acts2{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4)}
.acts2 .btn:last-child{margin-left:auto}
.lrow{display:flex;gap:var(--s2);align-items:stretch;margin-bottom:var(--s2)}
.lopen{flex:1;min-width:0;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-m);padding:var(--s3) var(--s4);cursor:pointer;color:var(--ink);font:inherit}
.lrow.cur .lopen{border-color:var(--accent-line);background:var(--accent-soft)}
.lopen b{display:block;font-weight:500;font-size:var(--fs-3);line-height:1.4}
.lopen small{display:block;color:var(--muted);font-size:var(--fs-2);font-weight:300;line-height:1.45}
.lrow .ib{height:auto;width:48px;border-radius:var(--r-m)}
.sw{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line);cursor:pointer}
.sw .ic{color:var(--accent);font-size:20px;display:inline-flex}
.sw .tx{flex:1;font-size:var(--fs-3)}
.sw input{display:none}
.sw .tg{width:48px;height:28px;border-radius:14px;background:var(--line2);position:relative;transition:.2s;flex:none}
.sw .tg::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked + .tg{background:var(--tq)}
.sw input:checked + .tg::after{left:23px}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--r-m);overflow:hidden}
.seg button{flex:1;font:inherit;font-size:var(--fs-2);border:0;background:transparent;padding:var(--s3) var(--s2);cursor:pointer;color:var(--muted);line-height:1.35}
.seg button+button{border-left:1px solid var(--line2)}
.seg button small{font-size:var(--fs-1);color:var(--faint);font-weight:300}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.seg button.on small{color:var(--accent)}
.sigwrap{position:relative;border:1px dashed var(--line2);border-radius:var(--r-m);background:#fff;height:220px}
.sigwrap canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.sigwrap::after{content:'';position:absolute;left:18px;right:18px;bottom:44px;border-bottom:1px solid #c9d0d2;pointer-events:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#e8f6f2;color:#052019;border-radius:var(--r-m);padding:var(--s3) var(--s4);font-size:var(--fs-2);line-height:1.5;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:min(92vw,420px);text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- ปร.4 / BOQ ---------- */
.bqs{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:var(--s3);align-items:end;margin-bottom:var(--s2)}
.bqs small{display:block;color:var(--muted);font-size:var(--fs-1)}
.bqs b{display:block;font-size:var(--fs-5);font-weight:600;line-height:1.25}
.bqs .big b{font-size:var(--fs-7);color:var(--accent)}
.bq-bar{position:relative;height:10px;background:var(--line);border-radius:6px;margin:var(--s2) 0 var(--s4)}
.bq-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#00a57d,#3fd8b0);border-radius:6px;transition:width .25s}
.bq-bar u{position:absolute;top:-4px;bottom:-4px;width:3px;background:#fff;border-radius:2px;text-decoration:none}
.bq-tool{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin:var(--s2) 0 var(--s3)}
.bq-tool .inp{flex:1;min-width:140px}
.bqg{margin-top:var(--s4)}
.bqg-h{display:flex;justify-content:space-between;gap:var(--s2);font-weight:500;font-size:var(--fs-2);color:var(--accent);padding:var(--s2) 0;border-bottom:1px solid var(--line)}
.bqg-h small{font-weight:400;color:var(--muted)}
.bqr{padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.bqr.hide{display:none}
.bqr-t{font-size:var(--fs-3);line-height:1.45}
.bqr-m{font-size:var(--fs-1);color:var(--muted);font-weight:300;margin-top:2px}
.bqr-c{display:flex;align-items:center;gap:6px;margin-top:var(--s2);flex-wrap:wrap}
.bqr-c .chip{min-height:32px;padding:3px 12px}
.bqr-c .bpc{position:relative;width:96px;margin-left:auto}
.cbody .bqr-c .bpc input{min-height:var(--h-sm);padding:6px 26px 6px 10px;text-align:right}
.bqr-c .bpc span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:var(--fs-2);pointer-events:none}
.bqr.done .bqr-t{color:var(--muted)}
.bq-top{display:grid;grid-template-columns:1.3fr 1fr 1.3fr;gap:var(--s3);align-items:end;margin-bottom:var(--s2)}
.bq-top small{display:block;color:var(--muted);font-size:var(--fs-1);margin-bottom:4px}
.bq-top b{font-size:var(--fs-4);font-weight:600}
.panel .bqi input,.panel .bqi textarea,.panel .bqi select{display:block;width:100%;min-height:var(--h-sm);font:inherit;font-size:var(--fs-2);padding:8px 12px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:var(--r-s);outline:0;resize:none;min-width:0}
.panel .bqi input:focus,.panel .bqi textarea:focus,.panel .bqi select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bqi-h{display:grid;grid-template-columns:60px 1fr 40px;gap:var(--s2);align-items:start}
.bqi-m{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:var(--s2);margin-top:var(--s3);align-items:end}
.bqi-m label>span,.bqi-m small{display:block;font-size:var(--fs-1);color:var(--muted);margin-bottom:2px}
.bqi-m b{font-size:var(--fs-3);font-weight:600}
.bqi details{margin-top:var(--s2)}
.bqi summary{cursor:pointer;color:var(--accent);font-size:var(--fs-2)}
.bqi .g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--s2);margin-top:var(--s2)}
.bqi .g3 label>span{display:block;font-size:var(--fs-1);color:var(--muted)}
.imrow{display:grid;grid-template-columns:28px 52px 1fr 112px;gap:6px;align-items:start;padding:var(--s2) 0;border-bottom:1px solid var(--line)}
.imrow input[type=text],.imrow input[type=number],.imrow textarea,.imrow .kd{width:100%;min-height:var(--h-sm);font:inherit;font-size:var(--fs-2);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 10px;background:var(--field);color:var(--ink);outline:0;resize:none;min-width:0}
.imrow.off{opacity:.45}
.imrow .gp{grid-column:3;font-size:var(--fs-1)}
.imrow .kd{grid-column:4}
.imrow input[type=checkbox]{width:20px;height:20px;margin-top:10px;accent-color:var(--tq)}
.mapg{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin:var(--s2) 0}
.mapg label>span{display:block;font-size:var(--fs-1);color:var(--muted);margin-bottom:2px}
.mapg select,.mapg input{width:100%;min-height:var(--h-sm);font:inherit;font-size:var(--fs-2);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 10px;background:var(--field);color:var(--ink)}
.sc-wrap{border-radius:var(--r-m);padding:var(--s2);background:#fff;overflow-x:auto}
.gtbl{width:100%;border-collapse:collapse;font-size:var(--fs-2);margin-top:var(--s2)}
.gtbl th,.gtbl td{padding:var(--s2) 4px;border-bottom:1px solid var(--line);text-align:right}
.gtbl th:first-child,.gtbl td:first-child{text-align:left}
.gtbl th{font-weight:500;color:var(--muted);font-size:var(--fs-1)}

/* ---------- ปฏิทิน ---------- */
.cal-nav{display:flex;align-items:center;gap:var(--s2);margin:var(--s3) 0 var(--s2)}
.cal-nav b{flex:1;text-align:center;font-size:var(--fs-4);font-weight:600}
.cal-wd,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-wd span{text-align:center;font-size:var(--fs-1);color:var(--faint);padding:var(--s1) 0}
.cd{aspect-ratio:1/1;border:1px solid var(--line);background:var(--surface2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:inherit;font-size:var(--fs-3);color:var(--ink);cursor:pointer;padding:0;position:relative}
.cd.has{background:var(--accent-soft);border-color:var(--accent-line);font-weight:600;color:var(--accent)}
.cd.today{border-color:var(--ink)}
.cd.cur::after{content:'';position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cd.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cd.sel.cur::after{background:var(--on-accent)}
.cd .dt{width:7px;height:7px;border-radius:50%;display:none}
.cd.has .dt{display:block}
.cd.sel .dt{box-shadow:0 0 0 1.5px var(--on-accent)}
.dt.normal{background:var(--done)}.dt.fast{background:var(--fast)}.dt.slow{background:var(--warn)}.dt.none{background:#9aa4a7}
.legend{display:flex;gap:var(--s3);flex-wrap:wrap;font-size:var(--fs-1);color:var(--muted);margin:var(--s3) 0 var(--s1)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.day{border:1px solid var(--line);border-radius:var(--r-l);padding:var(--s4) var(--s4) var(--s2);margin-top:var(--s3);background:var(--surface2)}
.day h5{margin:0;font-size:var(--fs-4);font-weight:600}
.day .sb2{color:var(--muted);font-size:var(--fs-2);font-weight:300;margin:2px 0 var(--s3)}
.kr{display:flex;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--line);font-size:var(--fs-2)}
.kr .ki{color:var(--accent);font-size:18px;margin-top:2px;flex:none}
.kr .kv2{flex:1;min-width:0}
.kr .kv2 small{color:var(--muted)}
.kr .kv2 p{margin:0 0 2px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--s1)}
.thumbs div{width:60px;height:48px;background:#05090a;border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumbs img{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
.day .rowbar{margin:var(--s3) 0 var(--s2)}
.empty-day{text-align:center;color:var(--muted);font-weight:300;padding:var(--s2) 0}

/* ---------- โครง: shell / หน้าหลัก / หน้าแก้ไข ---------- */
.shell{position:relative;min-height:100vh}
.main{min-width:0}
.view{display:none}
.shell[data-view=home] #home,.shell[data-view=editor] #editor{display:block}
.side{display:none}

/* ส่วนหัวหน้าแก้ไข */
.ehead{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--gut)}
.ehead .tt{flex:1;min-width:0}
.ehead .ib{border-color:transparent}
.avatar{width:40px;height:40px;border-radius:50%;background:#040707;border:1px solid var(--line2);display:grid;place-items:center;flex:none}
.avatar img{width:26px;height:auto;display:block}
.tt input.h-title{display:block;width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:var(--fs-4);font-weight:600;line-height:1.35;color:var(--ink);padding:0;letter-spacing:normal;border-radius:0}
.tt input.h-title:focus{box-shadow:0 1px 0 var(--accent)}
.h-sub{display:flex;flex-wrap:wrap;gap:2px var(--s3);align-items:center;font-size:var(--fs-1);color:var(--muted);font-weight:300;line-height:1.5}

/* แถบวันที่/ปุ่ม PDF */
.bar{position:sticky;top:0;z-index:20;padding:var(--s2) var(--gut) var(--s3);background:linear-gradient(var(--bg) 72%,rgba(6,9,10,0))}
.bar-in{display:flex;align-items:center;gap:var(--s3);min-height:60px;padding:var(--s2) var(--s2) var(--s2) var(--s4);background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-l);box-shadow:0 10px 28px rgba(0,0,0,.45)}
.bar-t{flex:1;min-width:0;cursor:pointer}
.bar-t b{display:block;font-weight:500;font-size:var(--fs-2);line-height:1.4}
.bar-t small{display:block;color:var(--muted);font-size:var(--fs-1);font-weight:300;line-height:1.4}
.bar .btn{min-height:44px;width:44px;padding:0;border-radius:50%}
.bar .btn .lb{display:none}
.bar .btn svg{font-size:20px}
#editor #form{padding:0 var(--gut)}
#editor .hint{padding:0 var(--gut)}
.jump{display:flex;gap:var(--s2);overflow-x:auto;padding:0 var(--gut) var(--s4);scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;min-height:var(--h-chip);padding:5px 14px;font:inherit;font-size:var(--fs-2);color:var(--muted);background:transparent;border:1px solid var(--line2);border-radius:var(--r-p);cursor:pointer;white-space:nowrap}
.jump button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

/* หน้าหลัก */
.hero{position:relative;overflow:hidden;isolation:isolate;padding:var(--gut) var(--gut) 52px;border-radius:0 0 32px 32px}
.hero::before{content:'';position:absolute;z-index:-2;left:-25%;right:-25%;top:-35%;height:150%;background:radial-gradient(52% 48% at 20% 12%,#00a57d 0%,rgba(0,165,125,0) 72%),radial-gradient(48% 44% at 86% 24%,#1b4872 0%,rgba(20,48,79,0) 74%),radial-gradient(46% 40% at 58% 62%,rgba(0,165,125,.55) 0%,rgba(0,165,125,0) 72%);filter:blur(26px)}
.hero::after{content:'';position:absolute;z-index:-1;inset:0;background:linear-gradient(180deg,rgba(6,9,10,0) 30%,rgba(6,9,10,.82) 78%,var(--bg) 100%)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.hero-logo{height:60px;width:auto;display:block}
.hero-act{display:flex;gap:var(--s2);align-items:center}
.round{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(6,9,10,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;font-size:22px;cursor:pointer;padding:0}
.hero-h{margin:var(--s6) 0 var(--s3);font-size:var(--fs-7);font-weight:600;line-height:1.25;letter-spacing:normal}
.hero-sub{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;color:#cfdcd8;font-size:var(--fs-2);line-height:1.5}
.datepill{display:inline-flex;align-items:center;gap:6px;min-height:36px;border:1px solid rgba(255,255,255,.22);background:rgba(6,9,10,.5);color:#fff;border-radius:var(--r-p);padding:4px 14px;font:inherit;font-size:var(--fs-2);cursor:pointer}
.uisw{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r-p);padding:3px;gap:2px;background:rgba(6,9,10,.55)}
.uisw button{border:0;background:transparent;color:var(--muted);height:36px;padding:0 14px;border-radius:var(--r-p);font:inherit;font-size:var(--fs-2);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.uisw button svg{font-size:18px}
.uisw button.on{background:var(--grad);color:#fff}
.uisw.mini button{padding:0 11px}
.uisw.mini button span{display:none}
.hsearch{position:relative;z-index:2;margin:-28px var(--gut) 0;min-height:56px;padding:0 var(--s5);display:flex;align-items:center;gap:var(--s3);background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-p);box-shadow:0 14px 34px rgba(0,0,0,.5);color:var(--muted);font-size:20px}
.hsearch input{background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:var(--fs-3);flex:1;min-width:0;min-height:44px}
.hbody{padding:var(--s6) var(--gut) 0;display:flex;flex-direction:column;gap:var(--s6)}
.hsum{border:1px solid var(--line2);border-radius:var(--r-l);padding:var(--s5);background:linear-gradient(135deg,rgba(0,165,125,.2),rgba(20,48,79,.42))}
.hs-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap}
.hs-top small{color:var(--muted);font-size:var(--fs-2)}
.hs-num{display:block;margin:var(--s2) 0 var(--s4);font-size:var(--fs-8);font-weight:600;line-height:1.1;color:#fff}
.hs-bar{position:relative;height:10px;border-radius:6px;background:rgba(255,255,255,.14)}
.hs-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#00a57d,#4fe0b9)}
.hs-bar u{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:#fff;text-decoration:none}
.hs-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-top:var(--s4)}
.hs-stats small{display:block;color:var(--muted);font-size:var(--fs-1);line-height:1.4}
.hs-stats b{display:block;font-size:var(--fs-3);font-weight:500;line-height:1.4;margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.tile{display:flex;flex-direction:column;gap:var(--s4);min-height:132px;padding:var(--s4);border:1px solid var(--line2);border-radius:var(--r-l);background:transparent;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.tile:hover{border-color:var(--accent-line);background:rgba(0,165,125,.05)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start}
.tile .hc-i{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:20px}
.tile .ar{font-size:20px;color:var(--muted)}
.tile b{display:block;font-size:var(--fs-3);font-weight:500;line-height:1.35}
.tile small{display:block;color:var(--muted);font-size:var(--fs-1);line-height:1.45;margin-top:2px}
.hhist-h{display:flex;justify-content:space-between;align-items:center;margin:0 0 var(--s1)}
.hhist-h h2{margin:0;font-size:var(--fs-5);font-weight:500}
.hhist-h button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:var(--fs-2);cursor:pointer;padding:var(--s2) 0}
.hrow{display:flex;align-items:center;gap:var(--s3);min-height:72px;padding:var(--s3) 0;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left;color:var(--ink);cursor:pointer;font:inherit}
.hrow .hi{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:radial-gradient(circle at 30% 30%,rgba(0,165,125,.4),rgba(20,48,79,.55));display:grid;place-items:center;font-size:20px;color:#fff;flex:none}
.hrow .hm{flex:1;min-width:0}
.hrow .hm b{display:block;font-weight:500;font-size:var(--fs-3);line-height:1.4}
.hrow .hm small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:var(--fs-2);line-height:1.45}
.hrow .hdot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.hrow .hdot.normal{background:var(--done)}.hrow .hdot.fast{background:var(--fast)}.hrow .hdot.slow{background:var(--warn)}
.hrow>svg{font-size:18px;color:var(--faint);flex:none}
.hrow.cur .hm b::after{content:' · เปิดล่าสุด';color:var(--accent);font-weight:400;font-size:.85em}
.hempty{color:var(--muted);text-align:center;padding:var(--s6) 0;font-weight:300}

/* เมนูลอย (มือถือ) */
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:2px;padding:8px;border-radius:var(--r-p);background:rgba(12,17,18,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line2);box-shadow:0 16px 40px rgba(0,0,0,.6)}
.dock button{position:relative;width:48px;height:48px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;font-size:22px;cursor:pointer;padding:0}
.dock button.on{color:var(--accent)}
.dock button.on:not(.prime)::after{content:'';position:absolute;bottom:3px;left:50%;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.dock button.prime{width:56px;height:56px;margin:0 6px;background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(0,165,125,.35)}
.dock button.prime.on{box-shadow:0 0 0 3px var(--accent-line),0 8px 20px rgba(0,165,125,.35)}

/* ---------- โหมดมือถือ ---------- */
html[data-ui=mobile] .shell{max-width:440px;margin:0 auto}
html[data-ui=mobile] .main{padding-bottom:112px}
@media (min-width:481px){
  html[data-ui=mobile] body{background:radial-gradient(900px 600px at 20% -10%,rgba(0,165,125,.18),transparent 60%),radial-gradient(900px 600px at 90% 10%,rgba(20,48,79,.4),transparent 60%),#04070a}
  html[data-ui=mobile] .shell{margin:24px auto;min-height:calc(100vh - 48px);border:1px solid var(--line2);border-radius:40px;background:var(--bg);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  html[data-ui=mobile] .dock{bottom:40px}
}
@media (max-width:400px){
  :root{--gut:16px}
  .hero-h{font-size:calc(27px*var(--fz))}
  .hs-num{font-size:calc(36px*var(--fz))}
  .ehead{gap:var(--s2)}
  .tt input.h-title{font-size:calc(15px*var(--fz))}
  .mrow{grid-template-columns:1fr 1fr 40px}.mrow .o{grid-column:1/3;grid-row:2}
  .g2{grid-template-columns:1fr}.g2.keep{grid-template-columns:1fr 1fr}
  .bqs{grid-template-columns:1fr 1fr}.bqs .big{grid-column:1/3}
  .bq-top{grid-template-columns:1fr 1fr}.bq-top>:first-child{grid-column:1/3}
  .bqi-m{grid-template-columns:1fr 1fr}.bqi-m>:nth-child(3){grid-column:1/3}
}
@media (max-width:345px){.avatar{display:none}.tt input.h-title{font-size:calc(14px*var(--fz))}.tiles{gap:var(--s2)}.tile{padding:var(--s3)}}
@media (max-width:540px){.g2{grid-template-columns:1fr}.g2.keep{grid-template-columns:1fr 1fr}.mrow{grid-template-columns:1fr 1fr 40px}.mrow .o{grid-column:1/3;grid-row:2}.bqs{grid-template-columns:1fr 1fr}.bqs .big{grid-column:1/3}.bq-top{grid-template-columns:1fr 1fr}.bq-top>:first-child{grid-column:1/3}.bqi-m{grid-template-columns:1fr 1fr}.bqi-m>:nth-child(3){grid-column:1/3}}

/* ---------- โหมดคอมพิวเตอร์ ---------- */
html[data-ui=desktop]{--gut:32px}
html[data-ui=desktop] .shell{display:grid;grid-template-columns:272px minmax(0,1fr);max-width:1400px;margin:0 auto}
html[data-ui=desktop] .side{display:flex;flex-direction:column;gap:var(--s6);padding:var(--s7) var(--s5) var(--s6);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}
html[data-ui=desktop] .dock{display:none}
html[data-ui=desktop] .main{padding:var(--s7) var(--s7) 64px}
html[data-ui=desktop] .hero{border-radius:32px;padding:var(--s6) var(--s7) 56px}
html[data-ui=desktop] .hero-logo{display:none}
html[data-ui=desktop] .hero-top{justify-content:flex-end}
html[data-ui=desktop] .hero-h{font-size:var(--fs-8);margin-top:var(--s5)}
html[data-ui=desktop] .uisw.mini button span{display:inline}
html[data-ui=desktop] .hsearch{margin:-28px var(--s7) 0}
html[data-ui=desktop] .hbody{padding:var(--s6) 0 0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"sum hist" "tiles hist";gap:var(--s6) var(--s7);align-items:start}
html[data-ui=desktop] .hsum{grid-area:sum}
html[data-ui=desktop] .tiles{grid-area:tiles;grid-template-columns:repeat(3,1fr)}
html[data-ui=desktop] .hhist-wrap{grid-area:hist}
html[data-ui=desktop] #editor{grid-template-columns:minmax(0,1fr) 320px;gap:0 var(--s6);align-items:start}
html[data-ui=desktop] .shell[data-view=editor] #editor{display:grid}
html[data-ui=desktop] #editor .ehead{grid-column:1/-1;padding:0 0 var(--s4)}
html[data-ui=desktop] #editor .jump{grid-column:1;flex-wrap:wrap;padding:0 0 var(--s4)}
html[data-ui=desktop] #editor .bar{grid-column:2;grid-row:2/span 3;position:sticky;top:var(--s5);padding:0;background:none}
html[data-ui=desktop] #editor #form{grid-column:1;padding:0}
html[data-ui=desktop] #editor .hint{grid-column:1;padding:0}
html[data-ui=desktop] .bar-in{flex-direction:column;align-items:stretch;gap:var(--s3);padding:var(--s5)}
html[data-ui=desktop] .bar .btn{width:100%;border-radius:var(--r-p);min-height:var(--h-ctl);padding:10px 22px}
html[data-ui=desktop] .bar .btn .lb{display:inline}
html[data-ui=desktop] #e-back{display:none}
html[data-ui=desktop] .toast{bottom:32px}

/* แถบด้านข้าง */
.side-brand{display:flex;flex-direction:column;gap:var(--s3);align-items:flex-start}
.side-brand img{height:88px;width:auto;display:block}
.side-brand small{color:var(--muted);font-size:var(--fs-1);line-height:1.5}
.side-nav{display:flex;flex-direction:column;gap:var(--s1)}
.side-nav button{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:44px;padding:0 var(--s4);border-radius:var(--r-m);border:0;background:transparent;color:var(--muted);font:inherit;font-size:var(--fs-3);cursor:pointer;text-align:left}
.side-nav button svg{font-size:20px}
.side-nav button:hover{background:var(--surface);color:var(--ink)}
.side-nav button.on{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:var(--s3)}
.side-foot .ss{font-size:var(--fs-1)}
body.printing{background:#fff!important}

/* ---------- แผ่น A4 สำหรับ PDF ---------- */
.sheets{position:absolute;left:0;top:0;z-index:-1;width:794px;pointer-events:none}
.pg{position:relative;width:794px;height:1123px;background:#fff;padding:40px 44px 58px;overflow:hidden;font-family:var(--font);color:var(--ink);font-size:calc(12.5px*var(--fz));line-height:1.5}
.measure{position:absolute;left:0;top:0;width:706px;visibility:hidden;font-family:var(--font);font-size:calc(12.5px*var(--fz));line-height:1.5;color:var(--ink)}
.pg svg.i,.measure svg.i{stroke-width:1.8}
.pg *,.cpg *,.measure *,.cmeasure *{letter-spacing:normal}
.pg .rh-k{letter-spacing:.16em}
.bl.end{padding-bottom:12px}
.pg-foot{position:absolute;left:44px;right:44px;bottom:24px;display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:8px;font-size:calc(10.5px*var(--fz));color:var(--faint)}
.pg-foot span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-foot span:last-child{white-space:nowrap}
.rh{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding-bottom:12px;border-bottom:2px solid var(--accent)}
.rh-org{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rh>div:first-child{flex:1;min-width:0}
.rh-ot{display:flex;flex-direction:column;gap:1px;min-width:0}
.rh-on{font-size:calc(13px*var(--fz));font-weight:500;overflow-wrap:anywhere;line-height:1.4}
.rh-oa{font-size:calc(11px*var(--fz));font-weight:400;color:#7b868a;line-height:1.4;overflow-wrap:anywhere}
.s-logo{display:block;max-height:50px;max-width:150px;width:auto;height:auto}
.rh-k{font-size:calc(10px*var(--fz));letter-spacing:.16em;color:var(--accent);font-weight:500}
.rh h1{margin:0;font-size:calc(23px*var(--fz));font-weight:600;line-height:1.3;letter-spacing:normal}
.rh-r{flex:none;min-width:190px;text-align:right}
.rh-r small{font-size:calc(10.5px*var(--fz));color:var(--faint);display:block}
.rh-r b{font-size:calc(26px*var(--fz));font-weight:600;color:var(--accent);line-height:1.15;display:block}
.rh-d{font-size:calc(12.5px*var(--fz));font-weight:500;margin-top:2px}
.rh-c{font-size:calc(11px*var(--fz));color:var(--muted);font-weight:300}
.hd{display:flex;align-items:center;gap:8px;font-size:calc(12.5px*var(--fz));font-weight:600;color:var(--accent);border-bottom:1px solid var(--line);padding:3px 0 5px;margin-bottom:7px}
.hd span{display:inline-flex;font-size:calc(15px*var(--fz))}
.kvg{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px}
.kv.full{grid-column:1/-1}
.kv small{display:block;font-size:calc(10px*var(--fz));color:var(--faint);line-height:1.3}
.kv div{font-size:calc(12.5px*var(--fz));font-weight:500;overflow-wrap:anywhere}
.wcs{display:flex;flex-wrap:wrap;gap:6px}
.wc{display:inline-flex;align-items:center;gap:5px;padding:3px 11px 3px 8px;border-radius:20px;border:1px solid var(--line);font-size:calc(11.5px*var(--fz));color:#a0a9ac}
.wc svg{font-size:calc(14px*var(--fz))}
.wc.on{background:var(--accent-soft);border-color:#a9cbd3;color:var(--accent);font-weight:500}
.wl{margin-top:6px;font-size:calc(12px*var(--fz));color:#33403f}
.wl b{font-weight:500;color:var(--accent)}
.wfg{display:grid;grid-template-columns:1fr 1fr;gap:3px 24px}
.wfr{display:flex;align-items:baseline;gap:6px}
.wfr i{flex:1;border-bottom:1px dotted #c3cacd;transform:translateY(-3px)}
.wfr b{font-weight:600;min-width:24px;text-align:right}
.wft{margin-top:6px;text-align:right;font-weight:500}
.wft b{color:var(--accent);font-size:calc(14px*var(--fz))}
.th,.tr{display:grid;grid-template-columns:26px 1fr 66px 56px 1.1fr;gap:8px;align-items:baseline}
.th{font-size:calc(10px*var(--fz));color:var(--faint);border-bottom:1px solid var(--line);padding-bottom:3px}
.tr{padding:4px 0;border-bottom:1px solid #edf0f0}
.tr .q{text-align:right}
.mch{display:flex;flex-wrap:wrap;gap:6px}
.mc{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:calc(12px*var(--fz));font-weight:500}
.mc em{font-style:normal;color:var(--muted);font-weight:400}
.es{color:var(--faint);font-size:calc(12px*var(--fz));padding:2px 0}
.wkr{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #edf0f0}
.wkn{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:calc(10.5px*var(--fz));font-weight:500;display:grid;place-items:center;margin-top:1px}
.wkt{flex:1;min-width:0;overflow-wrap:anywhere}
.wkm{margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:calc(10.5px*var(--fz));color:var(--muted);background:#f1f4f4;border-radius:6px;padding:0 8px}
.tag.p{background:var(--done-soft);color:var(--done);font-weight:500}
.pp{display:flex;gap:8px}
.pill{flex:1;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:#a0a9ac;font-size:calc(12px*var(--fz))}
.pill svg{font-size:calc(16px*var(--fz))}
.pill.on.normal{background:var(--done-soft);border-color:#9fd3b4;color:var(--done);font-weight:500}
.pill.on.fast{background:var(--fast-soft);border-color:#a8c3e6;color:var(--fast);font-weight:500}
.pill.on.slow{background:var(--warn-soft);border-color:#ebc59d;color:var(--warn);font-weight:500}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:8px}
.bar-l{display:flex;justify-content:space-between;font-size:calc(11px*var(--fz));color:var(--muted)}
.bar-l b{color:var(--ink);font-weight:600}
.bar-k{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:2px}
.bar-k i{display:block;height:100%}
.tb{font-size:calc(12.5px*var(--fz));overflow-wrap:anywhere}
.tb p{margin:0 0 2px}.tb ul{margin:2px 0;padding-left:18px}
.phr{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:10px;padding-bottom:10px}
.pic .pi{background:#f2f4f4;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic .pi img{display:block;max-width:100%;max-height:var(--mh);width:auto;height:auto}
.pic .cap{font-size:calc(11px*var(--fz));color:var(--muted);margin-top:3px;text-align:center;min-height:16px}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;align-items:start}
.sgcol .sb-l{text-align:center;margin-bottom:2px}
.sgrid2{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:6px 16px}
.sbx{text-align:center}
.sb-l{font-size:calc(11.5px*var(--fz));font-weight:500;color:var(--accent)}
.sb-img{height:62px;display:flex;align-items:flex-end;justify-content:center}
.sb-img img{max-height:58px;max-width:90%;width:auto;height:auto;display:block}
.sb-line{border-bottom:1px solid #8a9397;margin:2px 14px 4px}
.sb-n{font-size:calc(12.5px*var(--fz));min-height:19px}
.sb-p{font-size:calc(11px*var(--fz));color:var(--muted);min-height:16px}
.sb-d{font-size:calc(10.5px*var(--fz));color:var(--faint)}


/* ---------- แถบลายเซ็นย่อท้ายทุกหน้า ---------- */
.so{display:flex;gap:26px;align-items:flex-end}
.sog{min-width:0}
.sol{font-size:calc(10.5px*var(--fz));font-weight:600;margin-bottom:2px;text-align:center}
.sor{display:flex;gap:12px}
.sos{flex:1;min-width:0;text-align:center}
.soi{height:30px;display:flex;align-items:flex-end;justify-content:center}
.soi img{max-height:30px;max-width:92%;width:auto;height:auto;display:block}
.sob{border-bottom:1px dotted #333;margin:1px 4px 3px}
.son{font-size:calc(10.5px*var(--fz));min-height:15px;overflow-wrap:anywhere}
.son i{display:inline-block;min-width:70px;border-bottom:1px dotted #333;font-style:normal}
.sop{font-size:calc(9.5px*var(--fz));color:#444;min-height:13px;overflow-wrap:anywhere}
.cpg>.so{position:absolute;left:40px;right:40px;bottom:40px}
.pg>.so{position:absolute;left:44px;right:44px;bottom:58px}


/* ---------- แผ่นแบบตาราง (คลาสสิก) แนวนอน A4 ---------- */
.cpg{position:relative;width:1123px;height:794px;background:#fff;padding:26px 40px 40px;overflow:hidden;font-family:var(--font);color:#111;font-size:calc(12px*var(--fz));line-height:1.45}
.cmeasure{position:absolute;left:0;top:0;width:1043px;visibility:hidden;font-family:var(--font);font-size:calc(12px*var(--fz));line-height:1.45;color:#111}
.cpg svg.i,.cmeasure svg.i{stroke-width:1.9}
.ctop{text-align:center;padding-bottom:9px}
.ctop-row{display:flex;align-items:center;gap:10px}
.ctop-org{width:260px;flex:none;display:flex;flex-direction:row;align-items:center;gap:7px;text-align:left;line-height:1.3}
.ctop-org .s-logo{max-height:34px;max-width:52px;flex:none}
.ctop-org .ot{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.ctop-org .on,.ctop-org .oa{display:block}
.ctop-org .on{font-size:calc(10px*var(--fz));font-weight:500}
.ctop-org .oa{font-size:calc(8.5px*var(--fz));font-weight:400;color:#7b868a;line-height:1.3}
.ctop-c{flex:1;min-width:0}
.ctop-sp{width:260px;flex:none}
.ctop h1{margin:0;font-size:calc(17px*var(--fz));font-weight:600;line-height:1.35}
.ctop .l2{font-size:calc(13.5px*var(--fz));font-weight:600;line-height:1.35;text-wrap:balance}
.ctop-ln{margin-top:3px}
.ctop .l3{font-size:calc(12px*var(--fz));line-height:1.4}
.ctop .l4{font-size:calc(10.5px*var(--fz));color:#444;line-height:1.4;margin-top:1px}
.fit{white-space:nowrap;overflow:hidden}
.nw{display:inline-block;white-space:nowrap}
.ctop-s{font-size:calc(11.5px*var(--fz));color:#444;padding-bottom:8px;display:flex;justify-content:space-between;gap:12px}
.ct{border-top:1px solid #222;border-left:1px solid #222}
.cr{display:grid;grid-template-columns:var(--cols)}
.cc{border-right:1px solid #222;border-bottom:1px solid #222;padding:5px 7px;overflow-wrap:anywhere;min-width:0}
.cr.h .cc{background:#f1f3f3;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;padding:7px 4px;line-height:1.3}
.cr.blank .cc{min-height:40px}
.cc .cl{margin:0 0 3px}
.cc .cl small{color:#555;font-size:calc(11px*var(--fz))}
.cc .tb{font-size:calc(12px*var(--fz))}
.cc .dc{text-align:center}
.cc .dc b{display:block;font-weight:600}
.cc .dc small{display:block;color:#555;font-size:calc(10.5px*var(--fz));line-height:1.35}
.cc .dc small.stt{color:#111;font-weight:500;margin-top:3px}
.cbot{display:flex;gap:30px;padding-top:16px;align-items:flex-start}
.cbot>div{flex:1;min-width:0}
.cbot h4{margin:0 0 6px;font-size:calc(12.5px*var(--fz));font-weight:600}
.ck{display:flex;align-items:center;gap:8px;margin:5px 0 5px 26px}
.pb{display:inline-flex;align-items:center;justify-content:center;font-size:calc(13px*var(--fz))}
.pb svg{font-size:calc(13px*var(--fz));margin:0 3px;width:1em}
.pb u{display:inline-block;width:13px;text-decoration:none}
.cbot .ref{font-size:calc(10.5px*var(--fz));color:#555;margin:2px 0 0 26px;display:block;background:none;padding:0}
.sg{margin:2px 0 6px}
.sgl{display:flex;align-items:flex-end;gap:6px}
.sgl .dots{flex:1;border-bottom:1px dotted #333;height:34px;display:flex;justify-content:center;align-items:flex-end}
.sgl .dots img{max-height:32px;max-width:90%;width:auto;height:auto;display:block}
.sgn{text-align:center;margin-top:3px;min-height:18px}
.sgn i{display:inline-block;min-width:170px;border-bottom:1px dotted #333;font-style:normal}
.sgp{text-align:center;font-size:calc(11px*var(--fz));color:#444;min-height:15px}
.cfoot{position:absolute;left:40px;right:40px;bottom:16px;display:flex;justify-content:space-between;gap:16px;font-size:calc(10px*var(--fz));color:#888}
.cfoot span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfoot span:last-child{white-space:nowrap}

/* ---------- พิมพ์ (สำรองเมื่อออฟไลน์) ---------- */
@page{size:A4;margin:0}
body.printing .app,body.printing .shell,body.printing .modal,body.printing .toast,body.printing .dock{display:none!important}
body.printing .sheets{position:static!important;z-index:auto!important}
body.printing .pg,body.printing .cpg{page-break-after:always;break-after:page}
body.printing .pg{height:1120px}
body.printing .cpg{height:791px}
body.printing .sheets>:last-child{page-break-after:auto;break-after:auto}


/* ตัวแปรสีสำหรับแผ่น PDF (พื้นขาวเสมอ) */
.pg,.cpg,.measure,.cmeasure,.sheets{--ink:#16191a;--muted:#6b7478;--faint:#8a9397;--line:#e4e7e8;--line2:#cfd5d7;--bg:#f6f7f7;--card:#fff;--surface:#fff;--surface2:#fafbfb;--accent:#0e5a6b;--accent-soft:#e8f1f3;--accent-line:#a9cbd3;--done:#1f8a4c;--done-soft:#e5f4ea;--warn:#b8641c;--warn-soft:#fbeede;--fast:#2b6cb0;--fast-soft:#e6eefa;--danger:#b3261e;color:#16191a}

/* ---------- สภาพอากาศส่วนกลาง ---------- */
.wxs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin:0 0 12px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:var(--fs-1);line-height:1.5}
.wxs>span{flex:1 1 200px}
.wxs>svg,.wxs>.ico{flex:none}
.wxs.on{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.wxs.on small{color:var(--muted)}
.wxs.warn{border-style:solid;border-color:var(--warn);color:var(--ink);background:var(--warn-soft)}
/* ---------- ประกาศภัยพิบัติ ---------- */
.dz-row{min-height:64px}
.dz-i{display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;border-radius:50%;background:var(--surface2);color:var(--muted)}
.dz-i.on{background:var(--warn-soft);color:var(--warn)}
.dz-t{flex:1;min-width:0}.dz-t small{display:block;color:var(--muted);font-size:var(--fs-1);line-height:1.5}
.dz-badge{font-size:var(--fs-1);color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:0 8px;margin-left:4px}
.dz-area{border:1px solid var(--line);border-radius:14px;padding:12px 12px 0;margin:8px 0}
.dz-arow{display:flex;gap:8px;align-items:flex-end}.dz-arow .ib{margin-bottom:var(--s4)}
#dzPrev{margin:12px 0;line-height:1.6}
/* ---------- เวอร์ชัน / อัปเดต ---------- */
.upd-dot{display:inline-block;margin-left:auto;padding:1px 10px;border-radius:999px;background:var(--warn);color:#111;font-size:var(--fs-1);font-weight:600}
.upd-dot[hidden]{display:none}
.upd-bar{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 var(--s4);padding:12px 16px;border:1px solid var(--warn);border-radius:16px;background:var(--warn-soft);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.upd-bar small{display:block;color:var(--muted);font-size:var(--fs-1)}
.h-ver{display:flex;align-items:center;gap:8px;width:100%;margin:18px 0 8px;padding:8px 0;border:0;background:transparent;color:var(--muted);font:inherit;font-size:var(--fs-1);justify-content:center;cursor:pointer}
.h-ver .upd-dot{margin-left:6px}
.ab-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.ab-head img{height:56px;width:auto}
.ab-head small{display:block;color:var(--muted)}
.ab-ver{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.ab-ver>div{border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.ab-ver small{display:block;color:var(--muted);font-size:var(--fs-1)}
.ab-ver b{font-size:var(--fs-3)}
.upd-new{border-color:var(--warn)!important}
.upd-ok{color:var(--done)}
.upd-notes{white-space:pre-wrap;margin-top:8px;font-size:var(--fs-2);color:var(--ink)}
/* ---------- บัญชี / ซิงค์ ---------- */
[data-sync-badge]{display:inline-flex;align-items:center;justify-content:center}
[data-sync-badge].sy-ok{color:var(--done)}
[data-sync-badge].sy-err{color:var(--warn)}
[data-sync-badge].sy-wait{opacity:.75}
[data-sync-badge].sy-off{opacity:.6}
.sy-set{gap:10px;justify-content:flex-start}
.sy-card{display:flex;gap:12px;align-items:center;margin:0 0 12px}
.sy-card small{display:block;color:var(--muted)}
.sy-av{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:20px}
.sy-admin{margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
.sy-admin summary{cursor:pointer;color:var(--muted);font-size:var(--fs-1)}
.sy-admin textarea{font-family:ui-monospace,Consolas,monospace;font-size:12px;margin-top:8px}
#syForm .inp{margin:4px 0 10px}
.btn.line.danger{color:var(--danger)}
/* ---------- ปริมาณงาน (BOQ) ---------- */
.imrow .qu{grid-column:3/5;display:flex;gap:6px}.imrow .qu .qt{flex:1.2}.imrow .qu .ut{flex:1}
.bqi-q{margin-top:var(--s3)}.bqi-q label>span{display:block;font-size:var(--fs-1);color:var(--muted);margin-bottom:2px}
.bqi-q input{width:100%;min-height:var(--h-sm);font:inherit;font-size:var(--fs-2);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 10px;background:var(--field);color:var(--ink);box-sizing:border-box}
.bqq{display:flex;align-items:center;gap:8px;margin-top:var(--s2);font-size:var(--fs-2);color:var(--muted)}
.cbody .bqq input{width:110px;min-height:var(--h-sm);padding:6px 10px;text-align:right}
/* ---------- OCR: อ่านภาพ / PDF ---------- */
.ocr-top{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin:-4px 0 var(--s4)}
.ocr-top small{color:var(--muted);font-size:var(--fs-1)}
.scan-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s2);margin:var(--s3) 0}
.scan-list{display:flex;flex-wrap:wrap;gap:6px}
.scan-f{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 3px 3px 10px;border:1px solid var(--line);border-radius:999px;font-size:var(--fs-1);background:var(--surface2)}
.scan-f>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.scan-f .ib{width:30px;height:30px;min-height:30px;min-width:30px}
.ocr-eng>span{display:block;font-size:var(--fs-1);color:var(--muted);margin-bottom:2px}.ocr-eng b{display:block;font-size:var(--fs-2);font-weight:500;padding-top:6px}
.ocr-prog{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-top:var(--s2);border:1px solid var(--accent-line);border-radius:14px;background:var(--accent-soft);font-size:var(--fs-2)}
.spin{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--accent-line);border-top-color:var(--accent);animation:ocrspin .8s linear infinite}
@keyframes ocrspin{to{transform:rotate(360deg)}}
.ocr-f{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.ocr-f>input[type=checkbox],.ocr-m>input[type=checkbox]{width:20px;height:20px;margin-top:6px;accent-color:var(--tq)}
.ocr-f .lb{font-size:var(--fs-1);color:var(--muted);margin-bottom:4px;display:flex;flex-wrap:wrap;gap:2px 10px}
.ocr-f .old{color:var(--faint)}
.ocr-f.off .v{opacity:.55}
.ocr-f .inp,.ocr-tx{display:block;width:100%;font:inherit;font-size:var(--fs-2);min-height:var(--h-sm);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 10px;background:var(--field);color:var(--ink);resize:vertical;box-sizing:border-box}
.ocr-tx{margin:6px 0}
.ocr-d{margin:10px 0}.ocr-d summary{cursor:pointer;color:var(--muted);font-size:var(--fs-2);padding:6px 0}
.ocr-thumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.ocr-thumbs img{height:150px;width:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.ocr-m{display:grid;grid-template-columns:28px 1fr 96px 84px;gap:6px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line)}
.ocr-m input:not([type=checkbox]){width:100%;min-width:0;min-height:var(--h-sm);font:inherit;font-size:var(--fs-2);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 10px;background:var(--field);color:var(--ink);box-sizing:border-box}
.ocr-m.off{opacity:.45}
.ocr-grid{overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:10px}
.ocr-grid table{border-collapse:collapse;font-size:var(--fs-1)}.ocr-grid th,.ocr-grid td{border:1px solid var(--line);padding:3px 6px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;text-align:left}
.ocr-grid th{background:var(--surface2);color:var(--muted);font-weight:500;position:sticky;top:0}
.ocr-grid .cn{background:var(--done-soft)}.ocr-grid .ca{background:var(--warn-soft)}.ocr-grid .co{background:var(--accent-soft)}

const SIGN_MAX=3, SG_ROLES=['client','contractor'];
const blankPS=()=>({name:'',pos:''});
/* ชื่อ-ตำแหน่งผู้ควบคุมงาน เก็บที่ระดับโครงการ (กรอกครั้งเดียว ใช้ทุกวัน) · ลายเซ็นเก็บรายวันในแต่ละรายงาน */
function projSigners(pr){
  if(!pr.signers||typeof pr.signers!=='object') pr.signers={};
  SG_ROLES.forEach(k=>{
    let a=pr.signers[k]; if(!Array.isArray(a)||!a.length) a=pr.signers[k]=[blankPS()];
    if(a.length>SIGN_MAX) a.length=SIGN_MAX;
    a.forEach(x=>{if(typeof x.name!=='string')x.name='';if(typeof x.pos!=='string')x.pos=''});
  });
  return pr.signers;
}
function sigImgs(r){
  if(!r.sigImg||typeof r.sigImg!=='object') r.sigImg={};
  SG_ROLES.forEach(k=>{if(!Array.isArray(r.sigImg[k]))r.sigImg[k]=[]});
  return r.sigImg;
}
function ensureSigners(r){   // มุมมองอ่านอย่างเดียว: ชื่อ/ตำแหน่งจากโครงการ + ลายเซ็นของวันนั้น
  const P=projSigners(app.projects[r.projectId]||newProject()), I=sigImgs(r), o={};
  SG_ROLES.forEach(k=>{o[k]=P[k].map((x,i)=>({name:x.name,pos:x.pos,img:I[k][i]||''}))});
  return o;
}
function addProjSigner(pr,k){const a=projSigners(pr)[k];if(a.length<SIGN_MAX)a.push(blankPS())}
function delProjSigner(pr,k,i){projSigners(pr)[k].splice(i,1);projReports(pr.id).forEach(rp=>{sigImgs(rp)[k].splice(i,1)})}
function migrateSigners(){
  const legacy={};
  Object.values(app.reports).forEach(r=>{
    let L=null;
    if(r.signers) L=r.signers; else if(r.sign) L={client:[r.sign.client||{}],contractor:[r.sign.contractor||{}]};
    if(L){
      const I=sigImgs(r);
      SG_ROLES.forEach(k=>{(Array.isArray(L[k])?L[k]:[L[k]||{}]).slice(0,SIGN_MAX).forEach((x,i)=>{if(x&&x.img&&!I[k][i])I[k][i]=x.img})});
      legacy[r.id]=L;
    }
    delete r.signers; delete r.sign;
  });
  Object.values(app.projects).forEach(pr=>{
    if(!pr.signers){
      const reps=projReports(pr.id).filter(r=>legacy[r.id]);
      const named=reps.filter(r=>SG_ROLES.some(k=>(Array.isArray(legacy[r.id][k])?legacy[r.id][k]:[legacy[r.id][k]||{}]).some(x=>x&&String(x.name||'').trim())));
      const pick=(named.length?named:reps).slice(-1)[0];
      if(pick){const L=legacy[pick.id];pr.signers={};SG_ROLES.forEach(k=>{pr.signers[k]=(Array.isArray(L[k])?L[k]:[L[k]||{}]).slice(0,SIGN_MAX).map(x=>({name:(x&&x.name)||'',pos:(x&&x.pos)||''}))})}
    }
    projSigners(pr);
  });
}

function contractInfo(){

const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open('daily-report',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const dbGet=async k=>{const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const dbSet=async(k,v)=>{const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};

const loadImg=f=>new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=rej;im.src=u});
async function imgData(file,max,png){
  const im=await loadImg(file), s=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement('canvas');
  c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  const x=c.getContext('2d'); if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
  x.drawImage(im,0,0,c.width,c.height);
  return c.toDataURL(png?'image/png':'image/jpeg',0.86);
}
function bind(root,obj,after){

  });
}

/* --- สภาพอากาศ --- */
/* สภาพอากาศส่วนกลาง: โครงการที่อยู่ "ตำบล" เดียวกัน วันเดียวกัน ใช้ข้อมูลอากาศชุดเดียว (app.weather["วันที่|ตำบล"])
   ทุกรายงานยังเก็บสำเนาใน r.weather เหมือนเดิม → PDF / ปฏิทิน / ไฟล์สำรอง ใช้ได้ตามเดิม
   r.wxOwn = true → รายงานนั้นบันทึกแยกเฉพาะโครงการ ไม่ใช้ส่วนกลาง */
const normArea=s=>String(s||'').replace(/^\s*(ต\.|ตำบล|แขวง)\s*/,'').replace(/\s+/g,' ').trim().toLowerCase();
const guessTambon=loc=>{const m=String(loc||'').match(/(?:ต\.|ตำบล|แขวง)\s*([^\s,]+)/);return m?m[1]:''};
const projArea=p=>normArea(p&&p.tambon);
const wxKey=r=>{if(!r||r.wxOwn)return '';const a=projArea(app.projects[r.projectId]);return a?r.date+'|'+a:''};
const wxCopy=w=>({sel:[...((w&&w.sel)||[])],slots:[...((w&&w.slots)||[])],intensity:(w&&w.intensity)||'',other:(w&&w.other)||'',impact:(w&&w.impact)||''});
const wxEmpty=w=>!w||(!(w.sel||[]).length&&!String(w.other||'').trim()&&!String(w.impact||'').trim());
const wxSame=(a,b)=>JSON.stringify(wxCopy(a))===JSON.stringify(wxCopy(b));
const wxPeers=r=>{const k=wxKey(r);return k?Object.values(app.reports).filter(x=>x.id!==r.id&&wxKey(x)===k):[]};
function wxPush(r){ /* บันทึกจากรายงานนี้ → ส่วนกลาง + รายงานของโครงการอื่นในตำบลเดียวกัน วันเดียวกัน */
  const k=wxKey(r); if(!k) return;
  const w=wxCopy(r.weather); app.weather[k]={...w,by:r.projectId,at:Date.now()};
  wxPeers(r).forEach(x=>{if(!wxSame(x.weather,w))x.weather=wxCopy(w)});
}
function wxPull(r){ /* รายงานยังว่าง → ดึงจากส่วนกลาง (หรือจากโครงการอื่นที่บันทึกไว้แล้ว) */
  const k=wxKey(r); if(!k||!wxEmpty(r.weather)) return false;
  let s=app.weather[k];
  if(!s){const peer=wxPeers(r).find(x=>!wxEmpty(x.weather));if(!peer)return false;s=app.weather[k]={...wxCopy(peer.weather),by:peer.projectId,at:Date.now()}}
  if(wxEmpty(s)) return false;
  r.weather=wxCopy(s); return true;
}
function wxApplyAll(){ /* หลังซิงค์/เปิดแอป: รายงานที่ใช้ส่วนกลางต้องตรงกับส่วนกลาง */
  if(!app.weather||typeof app.weather!=='object') app.weather={};
  Object.values(app.reports).forEach(r=>{const k=wxKey(r),s=k&&app.weather[k];if(s&&!wxSame(r.weather,s))r.weather=wxCopy(s)});
}
function wxRelink(pid){ /* เปลี่ยนตำบลของโครงการ: รวมเข้าส่วนกลาง โดยไม่ทับข้อมูลเดิมที่ต่างกัน */
  let kept=0;
  projReports(pid).forEach(r=>{
    if(r.wxOwn) return; const k=wxKey(r); if(!k) return;
    let s=app.weather[k];
    if(!s){const peer=wxPeers(r).find(x=>!wxEmpty(x.weather));if(peer)s=app.weather[k]={...wxCopy(peer.weather),by:peer.projectId,at:Date.now()}}
    if(s&&!wxEmpty(s)){if(wxEmpty(r.weather))r.weather=wxCopy(s);else if(!wxSame(r.weather,s)){r.wxOwn=true;kept++}}
    else if(!wxEmpty(r.weather)) wxPush(r);
  });
  if(kept) toast('มีรายงาน '+kept+' ฉบับที่สภาพอากาศต่างจากส่วนกลาง — เก็บแยกไว้ตามเดิม (กด “ใช้ส่วนกลาง” ในรายงานนั้นได้)');
}

      h+='<div class="wxs on">'+ico('cloud')+'<span><b>สภาพอากาศส่วนกลาง ต.'+esc(area)+'</b> · '+thDate(r.date,false)+by+

    }
    h+='<div class="wgrid">'+WEATHER.map(o=>'<button type="button" class="wopt'+(w.sel.includes(o.k)?' on':'')+'" data-k="'+o.k+'">'+ico(o.i)+'<span>'+o.n+'</span></button>').join('')+'</div>';
    if(w.sel.includes('rain')){
      h+='<div class="sub"><div class="sl-t">'+ico('rain')+'ช่วงเวลาที่ฝนตก (เลือกได้หลายช่วง)</div><div class="chips">'+
        SLOTS.map(s=>'<button type="button" class="chip'+(w.slots.includes(s.k)?' on':'')+'" data-s="'+s.k+'">'+s.n+' <small>'+s.t+'</small></button>').join('')+'</div>'+
        '<div class="sl-t">ปริมาณฝน</div><div class="chips">'+INTENS.map((x,i)=>'<button type="button" class="chip'+(w.intensity===x?' on':'')+'" data-i="'+i+'">'+x+'</button>').join('')+'</div></div>';
    }
    if(w.sel.includes('other')) h+='<label class="fl"><span>สภาพอากาศอื่น ๆ (ระบุ)</span><input data-b="other" placeholder="ระบุ"></label>';
    h+='<label class="fl" style="margin-top:10px"><span>ผลกระทบต่อการทำงาน (ถ้ามี)</span><input data-b="impact" placeholder="เช่น หยุดงานภายนอกอาคาร 2 ชม."></label>';
    b.innerHTML=h;

    const on=(id,f)=>{const e=b.querySelector('#'+id);if(e)e.onclick=f};
    on('wxOwn',()=>{r.wxOwn=true;save();draw();toast('รายงานนี้บันทึกสภาพอากาศแยก — ไม่กระทบโครงการอื่น')});
    on('wxJoin',()=>{delete r.wxOwn;const k2=wxKey(r),s2=k2&&app.weather[k2];if(s2&&!wxEmpty(s2))r.weather=wxCopy(s2);else wxPush(r);save();draw()});
    on('wxUse',()=>{r.weather=wxCopy(s);save();draw()});
    on('wxMine',()=>{wxPush(r);save();draw();toast('ใช้สภาพอากาศของรายงานนี้เป็นส่วนกลางแล้ว')});

};

/* --- เซ็นชื่อ --- */
function openSig(role,idx){
  const pf=PF(), rep=R(), s={get img(){return sigImgs(rep)[role][idx]||''},set img(v){sigImgs(rep)[role][idx]=v}}, key=role+':'+idx;
  openModal('เซ็นชื่อ — '+(pf.sigLabels[role]||'')+' คนที่ '+(idx+1),mb=>{
    mb.innerHTML='<div class="sigwrap"><canvas id="sigC"></canvas></div><p class="sm-note">ใช้นิ้วหรือเมาส์เซ็นชื่อในกรอบด้านบน</p>'+
     '<label class="chk"><input type="checkbox" id="sigRem"> จำเป็นลายเซ็นประจำ (เรียกใช้ซ้ำในรายงานถัดไป)</label>'+
     '<div class="acts2"><button class="btn line sm" id="sClr" type="button">ล้าง</button>'+(pf.sigs[key]?'<button class="btn line sm" id="sUse" type="button">ใช้ลายเซ็นประจำ</button>':'')+
     '<button class="btn line sm" id="sUp" type="button">'+ico('ul')+'อัปโหลดรูป</button><button class="btn sm" id="sOk" type="button">'+ico('check')+'บันทึก</button></div><input type="file" id="sFile" accept="image/*" hidden>';
    const c=$('sigC'), dpr=Math.min(2,window.devicePixelRatio||1), W=c.clientWidth||480, H=c.clientHeight||220;
    c.width=W*dpr; c.height=H*dpr; const x=c.getContext('2d'); x.scale(dpr,dpr); x.lineWidth=2.4; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#10171a'; x.fillStyle='#10171a';
    let down=false,last=null,mid=null,bb=null;
    const pt=e=>{const q=c.getBoundingClientRect();return{x:e.clientX-q.left,y:e.clientY-q.top}};
    const ex=p=>{bb=bb?{a:Math.min(bb.a,p.x),b:Math.min(bb.b,p.y),c:Math.max(bb.c,p.x),d:Math.max(bb.d,p.y)}:{a:p.x,b:p.y,c:p.x,d:p.y}};
    c.onpointerdown=e=>{e.preventDefault();down=true;last=mid=pt(e);c.setPointerCapture(e.pointerId);x.beginPath();x.arc(last.x,last.y,1.2,0,7);x.fill();ex(last)};
    c.onpointermove=e=>{if(!down)return;const p=pt(e),m={x:(last.x+p.x)/2,y:(last.y+p.y)/2};x.beginPath();x.moveTo(mid.x,mid.y);x.quadraticCurveTo(last.x,last.y,m.x,m.y);x.stroke();mid=m;last=p;ex(p)};
    c.onpointerup=c.onpointercancel=()=>{down=false};
    $('sClr').onclick=()=>{x.clearRect(0,0,W,H);bb=null};
    const done=url=>{s.img=url;if($('sigRem')&&$('sigRem').checked)pf.sigs[key]=url;save();closeModal();rerender('sign')};
    $('sOk').onclick=()=>{
      if(!bb){toast('ยังไม่ได้เซ็นชื่อ');return}
      const pad=6,sx=Math.max(0,(bb.a-pad)*dpr),sy=Math.max(0,(bb.b-pad)*dpr),sw=Math.min(c.width-sx,(bb.c-bb.a+pad*2)*dpr),sh=Math.min(c.height-sy,(bb.d-bb.b+pad*2)*dpr);
      const o=document.createElement('canvas');o.width=sw;o.height=sh;o.getContext('2d').drawImage(c,sx,sy,sw,sh,0,0,sw,sh);done(o.toDataURL('image/png'));
    };
    const u=$('sUse'); if(u) u.onclick=()=>{s.img=pf.sigs[key];save();closeModal();rerender('sign')};
    $('sUp').onclick=()=>$('sFile').click();
    $('sFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{done(await imgData(f,700,true))}catch(z){toast('อ่านรูปไม่สำเร็จ')}};
  });
}

/* ============ ปร.4 / BOQ : น้ำหนักงานตามมูลค่า + ความก้าวหน้ารวม ============ */
const fmtN=(n,d=2)=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function boqOf(pid){const p=app.projects[pid];if(!p.boq)p.boq={items:[],factor:'1',contract:'',equipMult:'1.07',basis:'after'};return p.boq}
const EQ_DEF=1.07;
const kindOf=i=>i&&i.kind==='equip'?'equip':'con';
const multOf=(b,i)=>kindOf(i)==='equip'?(num(b.equipMult)||EQ_DEF):(num(b.factor)||1);
const itemVal=(b,i)=>num(i.amount)*(b.basis==='before'?1:multOf(b,i));
const kindSum=(b,k)=>b.items.filter(i=>kindOf(i)===k).reduce((s,i)=>s+num(i.amount),0);
const contractSum=b=>b.items.reduce((s,i)=>s+num(i.amount)*multOf(b,i),0);
const boqSum=b=>b.items.reduce((s,i)=>s+itemVal(b,i),0);
function progOf(r){if(!r.boqProg)r.boqProg={};return r.boqProg}

  const w0=src.naturalWidth||src.width, h0=src.naturalHeight||src.height, swap=rot%180!==0, mx=Math.max(w0,h0)||1;
  const sc=mx>2400?2400/mx:mx<1400?Math.min(2.5,1400/mx):1;

  const dw=swap?H:W, dh=swap?W:H; x.drawImage(src,-dw/2,-dh/2,dw,dh); x.setTransform(1,0,0,1,0,0);
  return c;
}
function ocrThumb(c){const s=Math.min(1,520/Math.max(c.width,c.height)),t=document.createElement('canvas');t.width=Math.round(c.width*s);t.height=Math.round(c.height*s);const x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,t.width,t.height);x.drawImage(c,0,0,t.width,t.height);return t.toDataURL('image/jpeg',0.7)}
async function ocrImage(c,onSt){
  const k=await ocrInit(onSt);

    const img=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height);
    try{
      const r=OCRE.w?(await ocrCall({t:'read',img})).r:await OCRE.main.read(img);

async function tessRead(c,onSt){

    const put=()=>{if(cur)lines.push({text:cur.t,row:ri,box:[[cur.x0*k,cur.y0*k],[cur.x1*k,cur.y0*k],[cur.x1*k,cur.y1*k],[cur.x0*k,cur.y1*k]]})};
    ws.forEach(w=>{const b=w.bbox;if(cur&&b.x0-cur.x1<1.2*hm){cur.t+=' '+w.text;cur.x1=b.x1;cur.y0=Math.min(cur.y0,b.y0);cur.y1=Math.max(cur.y1,b.y1)}else{put();cur={t:w.text,x0:b.x0,x1:b.x1,y0:b.y0,y1:b.y1}}});

}
/* ---- PDF: หน้าที่มีข้อความในไฟล์อยู่แล้ว (ส่งออกจาก Word/Excel) ใช้ข้อความนั้นเลย · หน้าสแกน/ข้อความไทยเพี้ยน → OCR ---- */
async function pdfLib(){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  if(!pdfLib.ok){pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob(['importScripts("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");'],{type:'text/javascript'}));pdfLib.ok=1}
  return pdfjsLib;
}
function pdfBroken(t){ // สัดส่วนอักษรที่เพี้ยน (ฟอนต์ไทยบางแบบแปลงเป็นข้อความไม่ได้)
  const ch=[...String(t).replace(/\s/g,'')]; if(!ch.length) return 1;
  const bad=ch.filter(c=>c==='\u0000'||c==='�'||(c>=''&&c<='')).length, th=ch.filter(c=>c>='ก'&&c<='๛').length;
  const wedged=th?((t.match(/[ก-๎](?=[^฀-๿\s0-9.,;:()\[\]\-\/'"%&+*!?…–—“”‘’·•][ก-๎])/g)||[]).length+(t.match(/[ฃฅ]/g)||[]).length)*5/th:0;
  const lone=th?(t.match(/(^|[^ก-ฮะ-ฺเ-๎])[ัิ-ฺ็-๎]/g)||[]).length*3/th:0;

}
function pdfLines(items,vpH){

  its.sort((a,b)=>a.y-b.y||a.x0-b.x0);
  const rows=[];
  its.forEach(it=>{const r=rows.find(r=>Math.abs(r.y-it.y)<=0.5*Math.min(r.h,it.h));if(r)r.its.push(it);else rows.push({y:it.y,h:it.h,its:[it]})});

  rows.forEach((r,ri)=>{
    r.its.sort((a,b)=>a.x0-b.x0); const cells=[];
    r.its.forEach(it=>{const c=cells[cells.length-1],gap=c?it.x0-c.x1:1e9;if(c&&gap<0.6*it.h){c.s+=(gap>0.2*it.h?' ':'')+it.s;c.x1=Math.max(c.x1,it.x1)}else cells.push({s:it.s,x0:it.x0,x1:it.x1})});
    cells.forEach(c=>{const s=c.s.replace(/\s+/g,' ').trim();if(s)lines.push({text:s,row:ri,box:[[c.x0,r.y-r.h/2],[c.x1,r.y-r.h/2],[c.x1,r.y+r.h/2],[c.x0,r.y+r.h/2]]})});

}
/* อ่านไฟล์ภาพ/PDF หลายไฟล์ → หน้า[] */
async function ocrFiles(files,rot,onSt){
  const pages=[], st=t=>{if(onSt)onSt(t)};
  for(let k=0;k<files.length;k++){
    const f=files[k], tag=files.length>1?'ไฟล์ '+(k+1)+'/'+files.length+': ':'';
    if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name||'')){
      st(tag+'กำลังเปิด PDF…');
      const lib=await pdfLib(), doc=await lib.getDocument({data:await f.arrayBuffer()}).promise, n=Math.min(doc.numPages,30);
      for(let p=1;p<=n;p++){
        const page=await doc.getPage(p), vp1=page.getViewport({scale:1});
        const tc=pdfLines((await page.getTextContent()).items,vp1.height);
        const sc=Math.min(4,2200/Math.max(vp1.width,vp1.height)), vp=page.getViewport({scale:sc});
        const c=document.createElement('canvas'); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
        const x=c.getContext('2d',{willReadFrequently:true}); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
        await page.render({canvasContext:x,viewport:vp}).promise;
        if(tc.text.replace(/\s/g,'').length>=30&&pdfBroken(tc.text)<=0.12){
          pages.push({text:tc.text,lines:tc.lines,w:vp1.width,h:vp1.height,src:'pdf-text',thumb:ocrThumb(c)});
          st(tag+'หน้า '+p+'/'+n+' ใช้ข้อความในไฟล์ PDF');
        }else{
          const cv=rot?ocrCanvas(c,rot):c; st(tag+'อ่านหน้า '+p+'/'+n+'…');
          const r=await ocrImage(cv,t=>st(tag+'หน้า '+p+'/'+n+': '+t)); r.thumb=ocrThumb(cv); pages.push(r);
        }
        page.cleanup();
      }
      try{await doc.destroy()}catch(e){}
    }else{
      st(tag+'กำลังเตรียมภาพ…');
      const im=await loadImg(f), c=ocrCanvas(im,rot);
      st(tag+'กำลังอ่านตัวอักษร…');
      const r=await ocrImage(c,t=>st(tag+t)); r.thumb=ocrThumb(c); pages.push(r);
    }
  }
  return pages;
}
const ocrText=pages=>pages.map(p=>p.text||'').join('\n').replace(/\n{3,}/g,'\n\n').trim();

/* ---- จัดผลอ่านเป็นตาราง (แถว × คอลัมน์) จากตำแหน่งข้อความ ใช้กับ ปร.4 / ปร.5 / ใบส่งของ / ตารางพื้นที่ภัยพิบัติ ---- */
function ocrCells(pg){
  const L=(pg.lines||[]).filter(l=>l&&l.box&&String(l.text||'').trim());
  let ux=0,uy=0; L.forEach(l=>{const a=l.box[0],b=l.box[1],d=Math.hypot(b[0]-a[0],b[1]-a[1])||1;ux+=(b[0]-a[0])/d;uy+=(b[1]-a[1])/d});
  const an=L.length?Math.atan2(uy,ux):0, co=Math.cos(-an), si=Math.sin(-an); // หมุนกลับให้แนวข้อความเป็นแนวนอน
  const by={};
  L.forEach(l=>{
    const ps=l.box.map(([x,y])=>[x*co-y*si,x*si+y*co]), xs=ps.map(p=>p[0]), ys=ps.map(p=>p[1]);
    const c={t:String(l.text).replace(/\s+/g,' ').trim(),x0:Math.min(...xs),x1:Math.max(...xs),y:(Math.min(...ys)+Math.max(...ys))/2,h:Math.max(...ys)-Math.min(...ys)};
    (by[l.row]=by[l.row]||[]).push(c);
  });
  return Object.keys(by).map(Number).sort((a,b)=>a-b).map(k=>{
    const out=[];
    by[k].sort((a,b)=>a.x0-b.x0).forEach(c=>{ // แยกช่องตัวเลขที่ติดกัน เช่น "12.00 ตร.ม. 350.00"
      const tk=c.t.split(' ');
      if(tk.length>1&&tk.some(t=>!isNaN(parseAmt(t)))&&tk.every(t=>!isNaN(parseAmt(t))||UNIT_RE.test(t))){
        let pos=0; const n=c.t.length||1;
        tk.forEach(t=>{const s=c.t.indexOf(t,pos);out.push({t,x0:c.x0+(c.x1-c.x0)*s/n,x1:c.x0+(c.x1-c.x0)*(s+t.length)/n,y:c.y,h:c.h});pos=s+t.length});
      }else out.push(c);
    });
    return out;
  });
}
function ocrGrid(pages){
  const rows=[];

    const rs=ocrCells(pg), multi=rs.filter(r=>r.length>=2), base=multi.length?multi:rs; let e0=Infinity,e1=-Infinity;

    const g=new Array(cols.length).fill('');
    r.forEach(c=>{
      let best=0,bo=-1; cols.forEach((k,j)=>{const o=Math.min(c.b,k.b)-Math.max(c.a,k.a);if(o>bo){bo=o;best=j}});

      g[best]=g[best]?g[best]+' '+c.t:c.t;

    return g;
  }).filter(g=>g.some(v=>v));
}
const ocrRowTexts=pages=>pages.flatMap(pg=>(pg.lines||[]).length?ocrCells(pg).map(r=>r.map(c=>c.t).join(' ')):String(pg.text||'').split('\n'));

/* ---- วันที่ภาษาไทย: "1 ตุลาคม 2568" "1 ต.ค. 68" "01/10/2568" ---- */
const thNum=s=>String(s==null?'':s).replace(/[๐-๙]/g,c=>TH_D.indexOf(c));
const MON_AB=TH_MON_S.map(m=>m.replace(/\./g,''));
const MON_ALT=[...TH_MON,...[...MON_AB].sort((a,b)=>b.length-a.length).map(m=>m.split('').join('\\.?\\s?')+'\\.?')].join('|');
const THDATE_RE=new RegExp('(\\d{1,2})\\s*(?:เดือน\\s*)?('+MON_ALT+')\\s*(?:พ\\.?\\s?ศ\\.?|ค\\.?\\s?ศ\\.?)?\\s*(\\d{4}|\\d{2})(?!\\d)','g');
const monIdx=s=>{s=s.replace(/[.\s]/g,'');const i=TH_MON.indexOf(s);return i>=0?i:MON_AB.indexOf(s)};
function toYmd(d,m,y){d=+d;y=+y;if(y<100)y+=2500;if(y>2400)y-=543;if(y<1990||y>2100||m<0||m>11||d<1||d>31)return '';const t=new Date(y,m,d);return t.getMonth()===m?ymd(t):''}

  while((m=re.exec(s))){const v=toYmd(m[1],+m[2]-1,m[3]);if(v&&!out.some(o=>m.index<o.e&&m.index+m[0].length>o.i))out.push({v,i:m.index,e:m.index+m[0].length})}

}
function dateNear(text,re,gap){ // วันที่แรกที่อยู่ถัดจากคำนำ (ห่างไม่เกิน gap ตัวอักษร)

const flat=s=>thNum(s).replace(/[ \t]*\n[ \t]*/g,' ').replace(/[ \t]+/g,' ');

function locParts(s){

/* ---- ข้อมูลโครงการ: หน้าแรกสัญญา / ปร.4–ปร.5 / ใบสั่งจ้าง / หนังสือแจ้งเริ่มงาน ---- */
