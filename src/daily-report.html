  o.start=dateNear(T,/(?:วันเริ่ม(?:ต้น)?(?:สัญญา|งาน|ปฏิบัติงาน|ทำงาน)?|เริ่ม(?:ต้น)?(?:ทำงาน|ปฏิบัติงาน|งาน|สัญญา|นับ)?(?:ตั้งแต่)?|นับตั้งแต่|ตั้งแต่)\s*(?:วันที่)?\s*/g,25);
  const end=dateNear(T,/(?:ให้)?(?:แล้วเสร็จ(?:ภายใน)?|สิ้นสุด(?:สัญญา)?|ครบกำหนด(?:สัญญา)?|กำหนดส่งมอบ(?:งาน)?|ถึง)\s*(?:วันที่)?\s*/g,25);
  m=F.match(/(?:ระยะเวลา|อายุสัญญา|กำหนด(?:เวลา)?(?:แล้วเสร็จ|ส่งมอบ)?|ภายใน)[^\d]{0,45}?(\d{1,4})\s*วัน/);
  o.days=m&&+m[1]>0&&+m[1]<=3000?String(+m[1]):(o.start&&end&&end>o.start?String(dayDiff(o.start,end)+1):'');
  m=F.match(/(?:วงเงิน(?:ค่าจ้าง|งบประมาณ|ตามสัญญา)?|ค่าจ้าง(?:ทั้งสิ้น)?|ราคา(?:ค่าจ้าง|ตามสัญญา)|เป็นเงิน(?:ทั้งสิ้น)?)[^\d]{0,30}?(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d{4,}(?:\.\d{1,2})?)\s*บาท/);
  o.value=m?String(parseAmt(m[1])):'';
  return o;
}

/* ---- ประกาศเขตการให้ความช่วยเหลือผู้ประสบภัยพิบัติกรณีฉุกเฉิน ---- */
function dzAreasText(F){
  const end='(?=\\s|,|\\(|\\)|$|\\d|หมู่|ม\\.|ต\\.|ตำบล|อ\\.|อำเภอ|จ\\.|จังหวัด|จำนวน|รวม|ได้แก่)';
  const re=new RegExp('(?:อำเภอ|อ\\.)\\s*('+TH_NAME+')'+end+'|(?:ตำบล|ต\\.)\\s*('+TH_NAME+')'+end+'|(?:หมู่ที่|หมู่|ม\\.)\\s*(\\d{1,3}(?:\\s*(?:[-–]|ถึง)\\s*\\d{1,3})?(?:\\s*(?:,|และ|\\s)\\s*\\d{1,3}(?:\\s*(?:[-–]|ถึง)\\s*\\d{1,3})?)*)','g');
  const STOPW=/^(ได้แก่|จำนวน|และ|ละ|ทั้ง|ที่|ต่าง|ใน|นั้น|ดังกล่าว|ดังนี้|เป็น)$/;
  const out=[]; let am='', m;
  while((m=re.exec(F))){
    if(m[1]){if(!STOPW.test(m[1]))am=m[1]}
    else if(m[2]){if(!STOPW.test(m[2]))out.push({amphoe:am,tambon:m[2],moos:''})}
    else if(m[3]&&out.length){const l=out[out.length-1],v=m[3].replace(/ถึง/g,'-').replace(/\s*[-–]\s*/g,'-').replace(/\s*(?:,|และ)\s*|\s+/g,',');l.moos=l.moos?l.moos+','+v:v}
  }
  return out;
}
function dzAreasGrid(grid){
  const hi=grid.findIndex(r=>r.some(c=>/อำเภอ/.test(c))&&r.some(c=>/ตำบล/.test(c))); if(hi<0) return [];
  const H=grid[hi], ca=H.findIndex(c=>/อำเภอ/.test(c)), ct=H.findIndex(c=>/ตำบล/.test(c)), cm=H.findIndex(c=>/หมู่/.test(c));
  const out=[]; let am='';
  for(let i=hi+1;i<grid.length;i++){
    const r=grid[i], j=r.join(' '); if(/รวม|ลงชื่อ|ประกาศ\s*ณ/.test(j)) break;
    const a=stripPre(r[ca]||'',/^\s*(?:\d+[.)]?\s*)?(อ\.|อำเภอ)?\s*/), t=stripPre(r[ct]||'',/^\s*(ต\.|ตำบล)\s*/), mo=cm>=0?thNum(r[cm]||''):'';
    if(a&&/^[ก-ฮเ-ไ]/.test(a)) am=a;
    if(t&&/^[ก-ฮเ-ไ]/.test(t)) out.push({amphoe:am,tambon:t.split(' ')[0],moos:/ทั้ง|ทุก/.test(mo)?'':mo.replace(/[^\d,\-–\s]/g,' ').trim().replace(/\s*[-–]\s*/g,'-').replace(/[\s,]+/g,',')});
  }
  return out;
}
function parseDisaster(text,grid){
  const T=thNum(text), F=flat(text), o={};
  const inner=(F.match(/กรณีฉุกเฉิน\s*\(\s*(?:กรณี)?\s*([^)]{2,60})\)/)||[])[1]||'';
  const hay=inner||F, has=w=>hay.includes(w);
  if(has('อุทกภัย')&&has('วาตภัย')&&has('ดินโคลน')) o.type='อุทกภัย วาตภัย และดินโคลนถล่ม';
  else{const t=[['อุทกภัย','อุทกภัย'],['วาตภัย','วาตภัย'],['ดินโคลน','ดินโคลนถล่ม'],['ภัยแล้ง','ภัยแล้ง'],['อัคคีภัย','อัคคีภัย']].map(([w,v])=>({v,i:hay.indexOf(w)})).filter(x=>x.i>=0).sort((a,b)=>a.i-b.i)[0];
    if(t)o.type=t.v; else if(inner){o.type='อื่น ๆ';o.typeOther=inner.trim()}}
  let m=F.match(new RegExp('ประกาศ\\s*จังหวัด\\s*('+TH_NAME+')(?=\\s|เรื่อง|$|\\d)'))||F.match(new RegExp('(?:จ\\.|จังหวัด)\\s*('+TH_NAME+')(?=\\s|$|\\d|,)'));
  o.province=m?m[1]:'';
  m=F.match(/(?:ฉบับที่|(?:^|\s)ที่)\s*(\d{1,4}\s*\/\s*(?:25)?\d{2})(?!\d)/); o.no=m?m[1].replace(/\s+/g,''):'';
  o.signed=dateNear(T,/(?:ประกาศ|สั่ง)\s*ณ\s*(?:วันที่)?\s*/g,15);
  o.start=dateNear(T,/(?:ตั้งแต่|นับตั้งแต่|นับแต่|เกิด(?:ภัย|เหตุ|สาธารณภัย)?(?:ขึ้น)?(?:เมื่อ)?|เมื่อ)\s*(?:วันที่)?\s*/g,30)||o.signed||((thDates(T)[0]||{}).v||'');
  const e=dateNear(T,/(?:จนถึง|ถึง|สิ้นสุด)\s*(?:วันที่)?\s*/g,25); o.end=e&&o.start&&e>=o.start?e:'';
  const g=grid&&grid.length?dzAreasGrid(grid):[];
  const areas=(g.length?g:dzAreasText(F)), seen={};
  o.areas=[];
  areas.forEach(a=>{const k=normAmp(a.amphoe)+'|'+normArea(a.tambon);if(seen[k]){if(a.moos)seen[k].moos=seen[k].moos?seen[k].moos+','+a.moos:a.moos;return}seen[k]={...a};o.areas.push(seen[k])});
  return o;
}

/* ---- ปร.5: Factor F ---- */
function findFactor(text){
  const T=thNum(text);
  const m=T.match(/factor\s*f?\s*[=:：]?\s*(\d[.,]\d{2,4})(?!\d)/i)||T.match(/ค่า\s*(?:factor\s*)?F\s*[=:：]?\s*(\d[.,]\d{2,4})(?!\d)/i);
  if(m){const v=parseFloat(m[1].replace(',','.'));if(v>=0.9&&v<=2)return v}
  for(const l of T.split('\n')){if(!/\d{1,3}(?:,\d{3})+\.\d{2}/.test(l))continue;const k=l.match(/(?:^|\s)(1\.\d{4})(?=\s|$)/);if(k)return +k[1]}
  return null;
}

/* ---- ใบส่งของ / ใบเสร็จวัสดุ → รายการวัสดุ ---- */
const MAT_UNIT_RE=/^(ถุง|ก้อน|คิว|ลบ\.?ม\.?|ตร\.?ม\.?|ม\.|เมตร|ซม\.?|มม\.?|กก\.?|กิโลกรัม|ตัน|ลิตร|แกลลอน|ถัง|กระป๋อง|ชุด|ต้น|แผ่น|เส้น|ท่อน|อัน|ตัว|ลูก|ใบ|บาน|ชิ้น|คู่|ม้วน|กล่อง|ลัง|โหล|ดวง|หลอด|เครื่อง|เที่ยว|คัน|กระสอบ|มัด|ขด|แท่ง|ห่อ|แพ็ค|ฟุต|นิ้ว|หลา|ตารางเมตร|ลูกบาศก์เมตร|ลบม\.?|ตรม\.?|pcs?|set|kg|m2|m3|ea|unit|box)$/i;
function parseMaterials(rowTexts){
  const out=[];
  rowTexts.forEach(raw=>{
    const s=thNum(raw).replace(/(\d)([ก-๙])/g,'$1 $2').replace(/[|¦]/g,' ').replace(/\s+/g,' ').trim();
    if(!s||/^(ลำดับ|รายการ|ที่\s|รวม|ยอด|ภาษี|vat|หมายเหตุ|ผู้รับ|ผู้ส่ง|ลงชื่อ)/i.test(s)||isTotalRow(s)) return;
    const tk=s.split(' '), isN=t=>t!=null&&!isNaN(parseAmt(t));
    let u=tk.findIndex((t,i)=>i>0&&MAT_UNIT_RE.test(t)&&isN(tk[i-1])); if(u<0) u=tk.findIndex((t,i)=>i>0&&MAT_UNIT_RE.test(t)&&isN(tk[i+1]));
    if(u<0) return;
    let qi=isN(tk[u-1])?u-1:u+1, q=parseAmt(tk[qi]);
    if(!(q>0)) return;
    let nm=tk.slice(0,Math.min(qi,u)); if(nm.length>1&&/^\d{1,3}[.)]?$/.test(nm[0])) nm=nm.slice(1);
    const name=nm.join(' ').replace(/^[\s\-–.:]+|[\s\-–:]+$/g,'');
    if((name.match(/[ก-ฮ]/g)||[]).length<2&&!/[A-Za-z]{3}/.test(name)) return;
    out.push({n:name,q:String(q),u:tk[u],inc:true});
  });
  return out;
}

     '<table class="gtbl" id="bqCat"></table>'+
     '<div class="bq-top" style="margin-top:10px"><label><small>Factor F (งานก่อสร้าง)</small><input class="inp" id="bqF" type="number" step="0.0001" inputmode="decimal"></label>'+
     '<label><small>ตัวคูณครุภัณฑ์</small><input class="inp" id="bqE" type="number" step="0.01" inputmode="decimal"></label>'+
     '<label><small>ยอดตามสัญญา (บาท)</small><input class="inp" id="bqC" type="number" step="0.01" inputmode="decimal"></label></div>'+
     '<label class="fl" style="display:block;margin-top:6px"><small style="display:block;color:var(--muted);font-size:calc(12px*var(--fz))">ฐานที่ใช้ถ่วงน้ำหนัก</small><select class="inp" id="bqB"><option value="after">ยอดหลังคูณ Factor / 1.07 (แนะนำ — ตรงกับยอดตามสัญญา)</option><option value="before">ยอด ปร.4 ก่อนคูณ</option></select></label>'+
     '<p class="sm-note">กรอก Factor หรือยอดตามสัญญาอย่างใดอย่างหนึ่ง อีกค่าจะคำนวณให้ (ใช้ยอดครุภัณฑ์ × ตัวคูณเป็นส่วนที่ตายตัว แล้วหา Factor จากส่วนที่เหลือ)</p>'+
     '<div class="bq-tool"><button class="btn sm" id="bqImp" type="button">'+ico('scan')+'นำเข้า ปร.4 / ปร.5</button><button class="btn ghost sm" id="bqF5" type="button">'+ico('scan')+'อ่าน Factor F (ปร.5)</button><button class="btn ghost sm" id="bqNew" type="button">'+ico('plus')+'เพิ่มรายการ</button><button class="btn ghost sm" id="bqSC2" type="button">'+ico('chart')+'ภาพรวม / S-Curve</button><button class="btn line sm" id="bqClr" type="button">'+ico('trash')+'ล้างทั้งหมด</button></div>'+
     '<div id="bqList"></div><datalist id="grpDl"></datalist>'+
     '<div class="stbox" id="bqFoot"></div>'+
     '<div class="acts2"><button class="btn sm" id="bqDone" type="button">'+ico('check')+'เสร็จสิ้น</button></div>';
    const F=$('bqF'),E=$('bqE'),C=$('bqC'),Bs=$('bqB');
    const recalcContract=()=>{bq.contract=bq.items.length?String(Math.round(contractSum(bq)*100)/100):'';C.value=bq.contract};
    if(!bq.equipMult) bq.equipMult=String(EQ_DEF);
    F.value=bq.factor||'1'; E.value=bq.equipMult; Bs.value=bq.basis==='before'?'before':'after';
    if(!bq.contract&&bq.items.length) recalcContract(); else C.value=bq.contract||'';
    const calcAll=()=>{
      const cs=kindSum(bq,'con'), es=kindSum(bq,'equip'), f=num(bq.factor)||1, e=num(bq.equipMult)||EQ_DEF, ct=cs*f+es*e, w=boqSum(bq);
      $('bqCat').innerHTML='<tr><th>ประเภท</th><th>ก่อนคูณ</th><th>ตัวคูณ</th><th>หลังคูณ</th><th>สัดส่วน</th></tr>'+
        '<tr><td>งานก่อสร้าง</td><td>'+fmtN(cs,2)+'</td><td>× '+fmtN(f,4)+'</td><td>'+fmtN(cs*f,2)+'</td><td>'+(ct?fmtN(cs*f/ct*100,2):'—')+'%</td></tr>'+
        '<tr><td>ครุภัณฑ์</td><td>'+fmtN(es,2)+'</td><td>× '+fmtN(e,4)+'</td><td>'+fmtN(es*e,2)+'</td><td>'+(ct?fmtN(es*e/ct*100,2):'—')+'%</td></tr>'+
        '<tr><td><b>รวม</b></td><td><b>'+fmtN(cs+es,2)+'</b></td><td></td><td><b>'+fmtN(ct,2)+'</b></td><td><b>100%</b></td></tr>';
      mb.querySelectorAll('.bqi').forEach(c=>{const it=bq.items.find(x=>x.id===c.dataset.id);c.querySelector('.wt b').textContent=w?fmtN(itemVal(bq,it)/w*100,3)+'%':'—';c.querySelector('.af b').textContent=fmtN(num(it.amount)*multOf(bq,it),2)});
      $('bqFoot').innerHTML='รายการทั้งหมด <b>'+bq.items.length+'</b> (ครุภัณฑ์ '+bq.items.filter(i=>kindOf(i)==='equip').length+') · ผลรวมน้ำหนัก <b>'+(w?'100.000':'0')+'%</b> · ยอดรวมหลังคูณ <b>'+fmtN(ct,2)+'</b> บาท'+(num(bq.contract)&&Math.abs(num(bq.contract)-ct)>1?'<br><span style="color:var(--warn)">ยอดตามสัญญาต่างจากยอดที่คำนวณ '+fmtN(num(bq.contract)-ct,2)+' บาท</span>':'');
    };
    F.oninput=()=>{bq.factor=F.value;recalcContract();calcAll();save()};
    E.oninput=()=>{bq.equipMult=E.value;recalcContract();calcAll();save()};
    Bs.onchange=()=>{bq.basis=Bs.value;calcAll();save()};
    C.oninput=()=>{
      bq.contract=C.value; const cs=kindSum(bq,'con'), eq=kindSum(bq,'equip')*(num(bq.equipMult)||EQ_DEF), cv=num(C.value);
      if(cs>0&&cv>eq){bq.factor=String(Math.round((cv-eq)/cs*1e6)/1e6);F.value=bq.factor}
      calcAll();save();
    };
    const draw=()=>{
      const box=$('bqList'); box.innerHTML='';
      $('grpDl').innerHTML=[...new Set(bq.items.map(i=>(i.grp||'').trim()).filter(Boolean))].map(g=>'<option value="'+esc(g)+'">').join('');
      if(!bq.items.length) box.innerHTML='<p class="muted">ยังไม่มีรายการ — กด “นำเข้า ปร.4” หรือ “เพิ่มรายการ”</p>';
      bq.items.forEach(it=>{
        const c=document.createElement('div');c.className='bqi';c.dataset.id=it.id;
        c.innerHTML='<div class="bqi-h"><input class="no" placeholder="ที่"><textarea class="nm" rows="1" placeholder="รายการงาน"></textarea><button type="button" class="ib danger del" aria-label="ลบรายการ">'+ico('trash')+'</button></div>'+
         '<div class="bqi-m"><label><span>จำนวนเงิน ปร.4 (บาท)</span><input class="am" type="number" step="any" inputmode="decimal"></label><div class="wt"><small>น้ำหนัก</small><b>—</b></div><div class="af"><small>หลังคูณ F / 1.07</small><b>—</b></div></div>'+
         '<div class="g2 keep bqi-q"><label><span>ปริมาณตามสัญญา</span><input class="qt" type="number" step="any" inputmode="decimal" placeholder="เช่น 120"></label><label><span>หน่วย</span><input class="ut" list="unitDl" placeholder="เช่น ตร.ม."></label></div>'+
         '<label style="display:block;margin-top:8px"><span style="display:block;font-size:calc(11.5px*var(--fz));color:var(--muted)">ประเภทงาน</span><select class="kd"><option value="con">งานก่อสร้าง (× Factor F)</option><option value="equip">ครุภัณฑ์ (× ตัวคูณครุภัณฑ์ เช่น 1.07)</option></select></label>'+
         '<details><summary>หมวดงาน / แผนงาน (ไม่บังคับ)</summary><div class="g3"><label><span>หมวดงาน</span><input class="gp" list="grpDl"></label><label><span>วันที่เริ่มตามแผน</span><input class="st" type="date"></label><label><span>วันที่เสร็จตามแผน</span><input class="en" type="date"></label></div><p class="sm-note">ถ้าไม่ใส่ แอปใช้วันเริ่มสัญญาและอายุสัญญาของโครงการเป็นช่วงแผน (กระจายเท่า ๆ กัน) — ครุภัณฑ์มักส่งมอบช่วงท้ายโครงการ ควรใส่วันตามแผนจริง</p></details>';
        const bindF=(s,k)=>{const e=c.querySelector(s);e.value=it[k]==null?'':it[k];e.oninput=()=>{it[k]=e.value;if(k==='amount'){recalcContract();calcAll()}save()}};
        bindF('.no','no');bindF('.nm','name');bindF('.am','amount');bindF('.gp','grp');bindF('.st','start');bindF('.en','end');bindF('.qt','qty');bindF('.ut','unit');
        const kd=c.querySelector('.kd');kd.value=kindOf(it);
        kd.onchange=()=>{
          it.kind=kd.value; const g=(it.grp||'').trim();
          if(g){const others=bq.items.filter(x=>x!==it&&(x.grp||'').trim()===g&&kindOf(x)!==it.kind);
            if(others.length&&confirm('ตั้งรายการอื่นในหมวด “'+g+'” อีก '+others.length+' รายการ เป็น'+(it.kind==='equip'?'ครุภัณฑ์':'งานก่อสร้าง')+'ด้วยหรือไม่?')){others.forEach(x=>x.kind=it.kind);save();recalcContract();draw();return}}
          recalcContract();calcAll();save();
        };
        const nm=c.querySelector('.nm');const gr=()=>{nm.style.height='auto';nm.style.height=nm.scrollHeight+'px'};nm.addEventListener('input',gr);
        c.querySelector('.del').onclick=()=>{if(!confirm('ลบรายการนี้?'))return;bq.items.splice(bq.items.indexOf(it),1);recalcContract();draw();save()};
        box.appendChild(c);gr();
      });
      calcAll();
    };
    draw();
    $('bqNew').onclick=()=>{const last=bq.items[bq.items.length-1];bq.items.push({id:uid(),no:String(bq.items.length+1),name:'',amount:'',grp:last?last.grp:'',kind:last?kindOf(last):'con',start:'',end:''});save();draw();const l=mb.querySelectorAll('.bqi .nm');l[l.length-1].focus()};
    $('bqClr').onclick=()=>{if(bq.items.length&&confirm('ลบรายการ ปร.4 ทั้งหมดของโครงการนี้? (ค่าความก้าวหน้ารายงานเดิมจะไม่ถูกนำมาคำนวณ)')){bq.items=[];bq.contract='';save();draw()}};
    $('bqImp').onclick=()=>openBoqImport(pid); $('bqF5').onclick=()=>openFactorScan(pid);
    $('bqSC2').onclick=()=>openSCurve(pid);
    $('bqDone').onclick=()=>{boqSyncProgress(R());save();closeModal();renderForm()};
  });
}

/* ---- ตัวช่วยนำเข้า ปร.4 (BOQ) / ปร.5 ---- */
function openBoqImport(pid){
  const bq=boqOf(pid);
  openModal('นำเข้า ปร.4 / ปร.5 (BOQ)',mb=>{
    mb.innerHTML=
     '<div class="note-box"><b>แม่นยำที่สุด: ไฟล์ Excel/CSV</b> หรือวางข้อความที่คัดลอกจาก Excel · <b>ภาพถ่าย / สแกน / PDF</b> อ่านด้วย OCR ภาษาไทย (OpenThai) แล้วจัดเป็นตารางให้เลือกคอลัมน์ ใช้ได้ทั้ง ปร.4 (รายการงาน) และ ปร.5 (สรุปตามหมวด + Factor F) — ทุกวิธีมีขั้นตอน “ตรวจทาน” ก่อนนำเข้า</div>'+
     '<div class="acts"><button class="btn line" id="imI" type="button">'+ico('scan')+'ภาพถ่าย / สแกน / PDF (OCR)</button><button class="btn line" id="imX" type="button">'+ico('sheet')+'ไฟล์ Excel / CSV</button><button class="btn line" id="imP" type="button">'+ico('clipboard')+'วางข้อความจาก Excel</button></div>'+
     '<input type="file" id="fX" accept=".xlsx,.xls,.csv,.xlsm" hidden>'+
     '<div id="imStage" style="margin-top:12px"></div><div class="acts2"><button class="btn line sm" id="imBack" type="button">กลับไปหน้า ปร.4</button></div>';
    const stage=$('imStage');
    $('imBack').onclick=()=>openBoq(pid);
    const busy=t=>{stage.innerHTML='<div class="note-box">'+esc(t)+'</div>'};
    const fail=(e,t)=>{console.error(e);stage.innerHTML='<div class="note-box" style="border-color:var(--warn)">'+esc(t||'อ่านไฟล์ไม่สำเร็จ')+' <small>('+esc(e&&e.message||e)+')</small></div>'};
    /* --- ตรวจทาน --- */
    const review=(items,srcNote,ex)=>{
      ex=ex||{};
      const fac=ex.factor!=null&&Math.abs(ex.factor-(num(bq.factor)||1))>1e-6?ex.factor:null;
      stage.innerHTML='<div class="note-box">'+(srcNote?esc(srcNote)+'<br>':'')+'ตรวจทานรายการด้านล่าง: ติ๊กออกแถวที่ไม่ใช่รายการงาน (เช่น ยอดรวม/ภาษี) แก้ชื่อหรือจำนวนเงินที่อ่านผิด แล้วกดนำเข้า</div>'+
       (fac!=null?'<label class="chk ocr-fac"><input type="checkbox" id="rvFac" checked> ตั้ง <b>Factor F = '+fac+'</b> (พบในเอกสาร ปร.5 — ค่าเดิม '+esc(bq.factor||'1')+')</label>':'')+
       (ex.pages?ocrThumbs(ex.pages):'')+
       '<div id="rvList"></div><div class="stbox" id="rvFoot"></div>'+
       '<div class="acts2"><button class="btn line sm" id="rvAdd" type="button">นำเข้าต่อท้ายรายการเดิม</button><button class="btn sm" id="rvRep" type="button">นำเข้าแทนที่ทั้งหมด</button>'+(ex.back?'<button class="btn ghost sm" id="rvBack" type="button">'+ico('left')+'กลับไปเลือกคอลัมน์</button>':'')+'</div>';
      const list=$('rvList');
      const foot=()=>{const inc=items.filter(x=>x.inc);$('rvFoot').innerHTML='เลือกไว้ <b>'+inc.length+'</b> จาก '+items.length+' แถว (ครุภัณฑ์ '+inc.filter(x=>x.kind==='equip').length+' · มีปริมาณ '+inc.filter(x=>num(x.qty)>0).length+') · ยอดรวมก่อนคูณ <b>'+fmtN(inc.reduce((a,x)=>a+num(x.amount),0),2)+'</b> บาท'};
      items.forEach(it=>{
        const row=document.createElement('div');row.className='imrow'+(it.inc?'':' off');
        row.innerHTML='<input type="checkbox" aria-label="นำเข้า"><input type="text" class="no" placeholder="ที่"><textarea class="nm" rows="2"></textarea><input type="number" class="am" step="any" inputmode="decimal"><input type="text" class="gp" placeholder="หมวดงาน"><select class="kd"><option value="con">งานก่อสร้าง</option><option value="equip">ครุภัณฑ์</option></select><div class="qu"><input type="number" class="qt" step="any" inputmode="decimal" placeholder="ปริมาณ" aria-label="ปริมาณตามสัญญา"><input type="text" class="ut" placeholder="หน่วย" list="unitDl" aria-label="หน่วย"></div>';
        const c=row.querySelector('input[type=checkbox]');c.checked=it.inc;c.onchange=()=>{it.inc=c.checked;row.classList.toggle('off',!it.inc);foot()};
        const b=(s,k,num_)=>{const e=row.querySelector(s);e.value=it[k]==null?'':it[k];e.oninput=()=>{it[k]=num_?parseFloat(e.value)||0:e.value;if(num_)foot()}};
        b('.no','no');b('.nm','name');b('.am','amount',true);b('.gp','grp');b('.qt','qty');b('.ut','unit');const kd=row.querySelector('.kd');kd.value=it.kind==='equip'?'equip':'con';kd.onchange=()=>{it.kind=kd.value;foot()};list.appendChild(row);
      });
      foot();
      const rb=$('rvBack'); if(rb) rb.onclick=ex.back;
      const apply=replace=>{
        const sel=items.filter(x=>x.inc&&num(x.amount)>0);
        if(!sel.length){toast('ยังไม่ได้เลือกรายการ');return}
        if(replace&&bq.items.length&&!confirm('แทนที่รายการ ปร.4 เดิม '+bq.items.length+' รายการ? (ค่าความก้าวหน้ารายงานเดิมที่ผูกกับรายการเก่าจะไม่ถูกนำมาคำนวณ)'))return;
        const nw=sel.map(x=>({id:uid(),no:String(x.no||''),name:x.name,amount:String(x.amount),qty:num(x.qty)>0?String(x.qty):'',unit:num(x.qty)>0?String(x.unit||'').trim():'',grp:x.grp||'',kind:x.kind==='equip'?'equip':'con',start:'',end:''}));
        bq.items=replace?nw:bq.items.concat(nw);
        const fc=$('rvFac'); if(fac!=null&&fc&&fc.checked) bq.factor=String(fac);
        bq.contract=bq.items.length?String(Math.round(contractSum(bq)*100)/100):'';
        save();toast('นำเข้า '+nw.length+' รายการแล้ว'+(fac!=null&&fc&&fc.checked?' · Factor F = '+fac:''));openBoq(pid);
      };
      $('rvRep').onclick=()=>apply(true);$('rvAdd').onclick=()=>apply(false);
    };
    /* --- เลือกคอลัมน์ (ใช้กับ Excel และตารางที่อ่านจากภาพ) --- */
    const mapStage=(rows,o)=>{
      let map=detectMap(rows);
      const hdrRow=()=>rows[Math.max(map.hr,0)]||[];
      const opt=(sel)=>Array.from({length:map.maxC},(_,c)=>{const h=String(hdrRow()[c]==null?'':hdrRow()[c]).slice(0,22);return '<option value="'+c+'"'+(c===sel?' selected':'')+'>'+colName(c)+(h?': '+esc(h):'')+'</option>'}).join('');
      const prevTbl=()=>{const R0=Math.max(map.hr,0),rs=rows.slice(R0,R0+9);return '<div class="ocr-grid"><table><tr><th></th>'+Array.from({length:map.maxC},(_,c)=>'<th class="'+(c===map.name?'cn':c===map.amt?'ca':c===map.no||c===map.qty||c===map.unit?'co':'')+'">'+colName(c)+'</th>').join('')+'</tr>'+
        rs.map((r,i)=>'<tr><th>'+(R0+i+1)+'</th>'+Array.from({length:map.maxC},(_,c)=>'<td class="'+(c===map.name?'cn':c===map.amt?'ca':c===map.no||c===map.qty||c===map.unit?'co':'')+'">'+esc(String(r[c]==null?'':r[c]).slice(0,40))+'</td>').join('')+'</tr>').join('')+'</table></div>'};
      const draw=()=>{
        stage.innerHTML=(o.top||'')+'<div class="mapg">'+(o.sheets?'<label><span>ชีต</span><select id="mS">'+o.sheets.names.map((n,i)=>'<option value="'+i+'"'+(i===o.sheets.cur?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select></label>':'')+
          '<label><span>แถวหัวตาราง'+(o.ocr?'':' (เลขแถวใน Excel)')+'</span><input id="mH" type="number" min="0" value="'+(map.hr+1)+'"></label>'+
          '<label><span>คอลัมน์ “รายการ”</span><select id="mN">'+opt(map.name)+'</select></label><label><span>คอลัมน์ “จำนวนเงิน” (ปร.4: รวมค่าวัสดุและแรงงาน · ปร.5: ค่างานต้นทุน)</span><select id="mA">'+opt(map.amt)+'</select></label>'+
          '<label><span>คอลัมน์ “ลำดับที่” (ถ้ามี)</span><select id="mO"><option value="-1">ไม่ระบุ</option>'+opt(map.no)+'</select></label>'+
          '<label><span>คอลัมน์ “จำนวน” (ปริมาณงาน)</span><select id="mQ"><option value="-1">ไม่ระบุ</option>'+opt(map.qty)+'</select></label><label><span>คอลัมน์ “หน่วย”</span><select id="mU"><option value="-1">ไม่ระบุ</option>'+opt(map.unit)+'</select></label></div>'+
          '<details class="ocr-d"'+(o.ocr?' open':'')+'><summary>ตัวอย่างตาราง (สีเขียว = รายการ · สีส้ม = จำนวนเงิน · สีฟ้า = ลำดับ / จำนวน / หน่วย)</summary><div id="mTbl"></div></details><div id="mRes"></div>';
        $('mO').value=String(map.no); $('mQ').value=String(map.qty); $('mU').value=String(map.unit);
        const go=()=>{
          const items=parseTable(rows,map,{wrap:!!o.ocr}); if(o.equip) items.forEach(x=>{x.kind='equip'});
          $('mTbl').innerHTML=prevTbl();
          $('mRes').innerHTML='<div class="note-box">พบ <b>'+items.length+'</b> รายการ (ยอดรวม '+fmtN(items.filter(x=>x.inc).reduce((s,x)=>s+x.amount,0),2)+' บาท)'+(' · มีปริมาณ '+items.filter(x=>num(x.qty)>0).length+' รายการ')+(o.factor!=null?' · พบ Factor F = <b>'+o.factor+'</b>':'')+' — ถ้าไม่ถูกต้องให้ปรับคอลัมน์ด้านบน</div><div class="acts2"><button class="btn sm" id="mGo" type="button">ไปขั้นตรวจทาน</button>'+(o.ocr?'<button class="btn line sm" id="mTx" type="button">ใช้ข้อความทีละบรรทัดแทน</button>':'')+'</div>';
          $('mGo').onclick=()=>review(items,o.label,{factor:o.factor,pages:o.pages,back:draw});
          const mt=$('mTx'); if(mt) mt.onclick=o.asText;
        };
        const mS=$('mS'); if(mS) mS.onchange=e=>o.sheets.onSheet(+e.target.value);
        $('mH').onchange=e=>{map.hr=(parseInt(e.target.value,10)||1)-1;go()};
        $('mN').onchange=e=>{map.name=+e.target.value;go()};$('mA').onchange=e=>{map.amt=+e.target.value;go()};$('mO').onchange=e=>{map.no=+e.target.value;go()};
        $('mQ').onchange=e=>{map.qty=+e.target.value;go()};$('mU').onchange=e=>{map.unit=+e.target.value;go()};
        go();
      };
      draw();
    };
    /* --- Excel / CSV --- */
    $('imX').onclick=()=>$('fX').click();
    $('fX').onchange=async e=>{
      const f=e.target.files[0];e.target.value='';if(!f)return;busy('กำลังอ่านไฟล์…');
      try{
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
        const wb=/\.csv$/i.test(f.name)?XLSX.read(await f.text(),{type:'string'}):XLSX.read(await f.arrayBuffer(),{type:'array'});
        const names=wb.SheetNames;
        const load=cur=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[names[cur]],{header:1,raw:true,defval:''});mapStage(rows,{label:'อ่านจากชีต “'+names[cur]+'”',equip:/ครุภัณฑ์/.test(names[cur]),factor:findFactor(rows.slice(0,200).map(r=>r.join(' ')).join('\n')),sheets:{names,cur,onSheet:load}})};
        load(0);
      }catch(err){fail(err,'อ่านไฟล์ Excel/CSV ไม่สำเร็จ (ต้องต่ออินเทอร์เน็ตเพื่อโหลดตัวอ่านไฟล์ หรือไฟล์เสียหาย)')}
    };
    /* --- วางข้อความ --- */
    $('imP').onclick=()=>{
      stage.innerHTML='<label class="fl" style="display:block"><span style="display:block;font-size:calc(12px*var(--fz));color:var(--muted);margin-bottom:3px">คัดลอกตาราง ปร.4 จาก Excel (ทั้งหัวตาราง) แล้ววางที่นี่</span><textarea class="inp" id="pTx" rows="8" style="width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px"></textarea></label><button class="btn sm" id="pGo" type="button">อ่านข้อมูล</button>';
      $('pGo').onclick=()=>{
        const txt=$('pTx').value; if(!txt.trim()){toast('ยังไม่ได้วางข้อความ');return}
        let items;
        if(/\t/.test(txt)){const rows=txt.split(/\r?\n/).map(l=>l.split('\t'));items=parseTable(rows,detectMap(rows))}
        else items=parseLines(txt);
        if(!items.length){toast('อ่านรายการไม่พบ — ลองคัดลอกให้ครบทั้งหัวตาราง');return}
        review(items,'อ่านจากข้อความที่วาง',{factor:findFactor(txt)});
      };
    };
    /* --- ภาพ / PDF (OCR) → ตาราง --- */
    $('imI').onclick=()=>ocrPick(stage,{hint:'ถ่ายภาพหรือเลือกไฟล์ <b>แบบ ปร.4</b> (ทุกแผ่น) หรือ <b>ปร.5</b> — PDF ที่ส่งออกจาก Excel/Word อ่านข้อความในไฟล์ได้ตรง 100% · ภาพถ่าย: วางกระดาษบนพื้นเรียบ ถ่ายตรงให้เห็นทั้งตาราง (หลายแผ่นถ่ายต่อกันได้)',onPages:pages=>{
      const text=ocrText(pages), grid=ocrGrid(pages), factor=findFactor(text), label='อ่านจากภาพ/PDF ('+pages.length+' หน้า · '+pages.engine+')';
      const asText=()=>{
        stage.innerHTML='<div class="note-box">ข้อความที่อ่านได้ (แก้ไขได้ก่อนจัดรายการ — แต่ละบรรทัดควรมี “ชื่อรายการ … จำนวนเงิน” โดยจำนวนเงินอยู่ท้ายบรรทัด)</div><textarea id="oTx" class="inp ocr-tx" rows="10"></textarea><div class="acts2"><button class="btn sm" id="oGo" type="button">จัดเป็นรายการ</button><button class="btn line sm" id="oTb" type="button">กลับไปแบบตาราง</button></div>';
        $('oTx').value=text;
        $('oTb').onclick=()=>mapStage(grid,{label,ocr:true,factor,pages,asText});
        $('oGo').onclick=()=>{const items=parseLines($('oTx').value);if(!items.length){toast('จัดรายการไม่ได้ — ตรวจสอบให้แต่ละบรรทัดมีชื่อรายการและจำนวนเงินท้ายบรรทัด');return}review(items,label,{factor:findFactor($('oTx').value),pages})};
      };
      if(grid.length<3||Math.max(...grid.map(r=>r.length))<2) asText();
      else mapStage(grid,{label,ocr:true,factor,pages,asText,top:'<div class="note-box">จัดผลอ่านเป็นตารางแล้ว '+grid.length+' แถว — เลือกคอลัมน์ “รายการ” และ “จำนวนเงิน” ให้ตรง (แอปเดาให้จากหัวตาราง)</div>'});
    }});
  });
}

/* ---- ส่วนเลือกภาพ / ถ่ายภาพ / PDF → อ่าน (ใช้ร่วมกันทุกฟอร์ม) ---- */
function ocrPick(box,o){
  const files=[]; const touch=matchMedia('(pointer:coarse)').matches;
  box.innerHTML=(o.onBack?'<button class="btn ghost sm" data-back type="button">'+ico('left')+'กลับ</button>':'')+
    '<div class="note-box">'+o.hint+'</div>'+
    '<div class="scan-acts">'+(touch?'<button class="btn" type="button" data-cam>'+ico('camera')+'ถ่ายภาพ</button>':'')+
    '<button class="btn'+(touch?' line':'')+'" type="button" data-file>'+ico('imgplus')+'เลือกภาพ / PDF</button></div>'+
    '<div class="scan-q" data-q></div>'+
    '<div class="mapg"><label><span>หมุนภาพ</span><select data-rot><option value="0">อัตโนมัติ</option><option value="90">หมุนขวา 90°</option><option value="270">หมุนซ้าย 90°</option><option value="180">กลับหัว 180°</option></select></label>'+
    '<div class="ocr-eng"><span>ตัวอ่าน</span><b data-eng>'+esc(ocrEngName())+'</b></div></div>'+
    '<p class="sm-note">ถ่ายตรง ๆ ให้เห็นทั้งหน้า แสงสม่ำเสมอ ตัวหนังสือคมชัด · อ่านได้เฉพาะตัวพิมพ์ (ยังอ่านลายมือไม่ได้) · อ่านในเครื่องนี้ ไม่ส่งภาพออกไปที่ใด · ผลอ่านต้องตรวจทานก่อนใช้ทุกครั้ง</p>'+
    '<div data-st></div>'+
    '<input type="file" data-fi accept="image/*,application/pdf,.pdf" multiple hidden><input type="file" data-ci accept="image/*" capture="environment" hidden>';
  const q=s=>box.querySelector(s), st=q('[data-st]');
  const drawQ=()=>{
    const el=q('[data-q]');
    el.innerHTML=files.length?'<div class="scan-list">'+files.map((f,i)=>'<span class="scan-f">'+ico(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)?'pdf':'image')+'<span>'+(i+1)+'. '+esc(f.name||'ภาพถ่าย')+'</span><button type="button" class="ib" data-x="'+i+'" aria-label="เอาออก">×</button></span>').join('')+'</div>'+
      '<div class="acts2" style="margin-top:8px"><button class="btn" type="button" data-go>'+ico('scan')+'เริ่มอ่าน ('+files.length+' ไฟล์)</button>'+(touch?'<button class="btn line sm" type="button" data-more>'+ico('camera')+'ถ่ายหน้าถัดไป</button>':'')+'</div>':'';
    el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.x,1);drawQ()});
    const go=el.querySelector('[data-go]'); if(go) go.onclick=run;
    const mo=el.querySelector('[data-more]'); if(mo) mo.onclick=()=>q('[data-ci]').click();
  };
  const add=e=>{[...e.target.files].forEach(f=>files.push(f));e.target.value='';drawQ();if(files.length&&!touch&&files.every(f=>/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)))run()};
  q('[data-fi]').onchange=add; q('[data-ci]').onchange=add;
  q('[data-file]').onclick=()=>q('[data-fi]').click();
  const cam=q('[data-cam]'); if(cam) cam.onclick=()=>q('[data-ci]').click();
  const bk=q('[data-back]'); if(bk) bk.onclick=o.onBack;
  let busy=false;
  async function run(){
    if(busy||!files.length) return; busy=true;
    box.querySelectorAll('button,select').forEach(b=>b.disabled=true);
    const msg=t=>{st.innerHTML='<div class="ocr-prog"><span class="spin"></span><span>'+esc(t)+'</span></div>'};
    try{
      const pages=await ocrFiles(files.slice(),+q('[data-rot]').value||0,msg);
      const eng=q('[data-eng]'); if(eng) eng.textContent=ocrEngName();
      if(!pages.some(p=>String(p.text||'').trim())) throw new Error('ไม่พบตัวอักษรในภาพ');
      pages.engine=pages.some(p=>p.src==='ocr')?ocrEngName():'ข้อความในไฟล์ PDF';
      o.onPages(pages);
    }catch(e){
      console.error(e); busy=false; box.querySelectorAll('button,select').forEach(b=>b.disabled=false);
      const em=String(e&&e.message||e), net=/^load https|fetch|dynamically imported|NetworkError/i.test(em);
      st.innerHTML='<div class="note-box" style="border-color:var(--warn)">'+(net?'โหลดตัวอ่าน OCR ไม่สำเร็จ — ตรวจการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่':'อ่านไม่สำเร็จ: '+esc(em))+'<br><small>ลองถ่ายใหม่ให้ชัดขึ้น หมุนภาพ หรือใช้ไฟล์ PDF'+(OCR_LOCAL?'':' (ไฟล์ .html ต้องต่ออินเทอร์เน็ตครั้งแรกเพื่อโหลดตัวอ่าน)')+'</small></div>';
    }
  }
  drawQ();
}
const ocrThumbs=pages=>pages&&pages.some(p=>p.thumb)?'<details class="ocr-d"><summary>ภาพต้นฉบับ ('+pages.length+' หน้า)</summary><div class="ocr-thumbs">'+pages.map(p=>p.thumb?'<img alt="" src="'+p.thumb+'">':'').join('')+'</div></details>':'';
/* ---- ตรวจทานค่าที่อ่านได้ทีละช่อง: ติ๊กเลือก แก้ได้ แล้วจึงนำไปใช้ ---- */
function ocrReview(box,o){
  const shown=v=>o.show?o.show(v):v;
  const F=o.fields.map(f=>{const v=f.v==null?'':String(f.v),cur=f.cur==null?'':String(f.cur).trim();return {...f,v,cur,on:!!v&&!f.weak&&(!cur||cur===v.trim())}});
  const found=F.filter(f=>f.v).length;
  box.innerHTML=(o.onBack?'<button class="btn ghost sm" data-back type="button">'+ico('left')+'กลับ</button>':'')+
    '<div class="note-box">อ่านด้วย '+esc(o.pages&&o.pages.engine||ocrEngName())+' · พบข้อมูล <b>'+found+'</b> ช่อง — ตรวจทานก่อนใช้: ติ๊กช่องที่จะใส่ แก้คำที่อ่านผิดได้ (ช่องที่มีข้อมูลเดิมอยู่แล้วจะไม่ถูกติ๊กไว้ให้)</div>'+
    F.map((f,i)=>'<div class="ocr-f'+(f.on?'':' off')+'" data-i="'+i+'"><input type="checkbox" aria-label="ใช้ค่านี้"'+(f.on?' checked':'')+'><div><div class="lb">'+esc(f.l)+
      (f.cur?'<span class="old">เดิม: '+esc(f.type==='date'?thDate(f.cur,false):f.cur)+'</span>':'')+(f.weak&&f.v?'<span class="old">(เดาจากที่อยู่ในเอกสาร)</span>':'')+'</div>'+
      (f.type==='area'?'<textarea class="inp v" rows="2"></textarea>':'<input class="inp v"'+(f.type==='date'?' type="date"':f.type==='number'?' type="number" step="any" inputmode="decimal"':'')+'>')+'</div></div>').join('')+
    '<details class="ocr-d"><summary>ข้อความที่อ่านได้ (แก้แล้วกด “แยกข้อมูลใหม่”)</summary><textarea class="inp ocr-tx" rows="8"></textarea><button class="btn line sm" data-re type="button">แยกข้อมูลใหม่จากข้อความนี้</button></details>'+
    ocrThumbs(o.pages)+
    '<div class="acts2"><button class="btn" data-ok type="button">'+ico('check')+(o.okLabel||'ใช้ข้อมูลที่เลือก')+'</button><button class="btn line sm" data-again type="button">'+ico('scan')+'อ่านเอกสารอื่น</button></div>';
  box.querySelectorAll('.ocr-f').forEach(row=>{
    const f=F[+row.dataset.i], cb=row.querySelector('input[type=checkbox]'), v=row.querySelector('.v');
    v.value=f.v; if(v.tagName==='TEXTAREA') setTimeout(()=>grow(v));
    cb.onchange=()=>{f.on=cb.checked;row.classList.toggle('off',!f.on)};
    v.oninput=()=>{f.v=v.value;if(!cb.checked&&v.value.trim()){cb.checked=true;f.on=true;row.classList.remove('off')}};
  });
  const tx=box.querySelector('.ocr-tx'); tx.value=o.text||'';
  box.querySelector('[data-re]').onclick=()=>o.reparse(tx.value);
  box.querySelector('[data-again]').onclick=o.again;
  const bk=box.querySelector('[data-back]'); if(bk) bk.onclick=o.onBack;
  box.querySelector('[data-ok]').onclick=()=>{
    const vals={}; F.forEach(f=>{if(f.on&&String(f.v).trim()!=='')vals[f.k]=String(f.v).trim()});
    if(!Object.keys(vals).length){toast('ยังไม่ได้เลือกช่องที่จะใส่');return}
    o.onApply(vals);
  };
}

/* ---- ข้อมูลโครงการจากเอกสาร ---- */
function openProjScan(){
  const pr=PR(), pid=pr.id;
  openModal('อ่านข้อมูลโครงการจากเอกสาร',mb=>{
    const pick=()=>ocrPick(mb,{hint:'ถ่ายภาพหรือเลือกไฟล์ที่มีข้อมูลโครงการ เช่น <b>หน้าแรกของสัญญาจ้าง</b> · <b>แบบ ปร.4 / ปร.5</b> (ส่วนหัว) · ใบสั่งจ้าง · หนังสือแจ้งให้เริ่มงาน — ใส่หลายหน้าได้ แอปจะหาชื่อโครงการ ผู้ว่าจ้าง ผู้รับจ้าง สถานที่ (หมู่/ตำบล/อำเภอ/จังหวัด) เลขที่สัญญา วันเริ่ม อายุสัญญา และวงเงิน',onPages:pages=>show(ocrText(pages),pages)});
    const show=(text,pages)=>{
      const g=parseProject(text), bq=boqOf(pid), weak=g._weak||[];
      const fields=[['name','ชื่อโครงการ','area'],['client','ผู้ว่าจ้าง'],['contractor','ผู้รับจ้าง'],['location','สถานที่ก่อสร้าง','area'],['moo','หมู่ที่'],['tambon','ตำบล'],['amphoe','อำเภอ'],['province','จังหวัด'],
        ['contractNo','เลขที่สัญญา'],['extra','รายละเอียดใต้ชื่อโครงการ (แหล่งงบประมาณ / ปีงบประมาณ)'],['start','วันเริ่มสัญญา','date'],['days','อายุสัญญา (วัน)','number'],['value','วงเงินตามสัญญา (บาท) — ใช้เป็นยอดตามสัญญาใน ปร.4','number']]
        .map(([k,l,type])=>({k,l,type,v:g[k]||'',cur:k==='value'?bq.contract:pr[k],weak:weak.includes(k)}));
      ocrReview(mb,{fields,text,pages,reparse:t=>show(t,pages),again:pick,onApply:vals=>{
        let n=0;
        Object.keys(vals).forEach(k=>{if(k==='value')return;pr[k]=vals[k];n++});
        if(vals.value){const cv=parseAmt(vals.value);if(cv>0){bq.contract=String(cv);n++;const cs=kindSum(bq,'con'),eq=kindSum(bq,'equip')*(num(bq.equipMult)||EQ_DEF);if(cs>0&&cv>eq)bq.factor=String(Math.round((cv-eq)/cs*1e6)/1e6)}}
        if(vals.location){const lg=locParts(pr.location);['moo','tambon','amphoe','province'].forEach(k=>{if(lg[k]&&!String(pr[k]||'').trim())pr[k]=lg[k]})}
        wxRelink(pid); dzApplyAll(); boqSyncProgress(R()); save(); closeModal(); renderForm();
        toast('ใส่ข้อมูลโครงการจากเอกสารแล้ว '+n+' ช่อง — ตรวจอีกครั้งในหัวข้อ “โครงการ”');
      }});
    };
    pick();
  });
}

/* ---- อ่านข้อความจากภาพ ใส่ในช่องข้อความของรายงาน ---- */
function openTextScan(k,label){
  const r=R();
  openModal('อ่านข้อความจากภาพ — '+label,mb=>{
    const pick=()=>ocrPick(mb,{hint:'ถ่ายภาพหรือเลือกไฟล์เอกสารที่พิมพ์ไว้ เช่น หนังสือสั่งการ บันทึกข้อความ รายงานผลการทดสอบ หรือหน้าจอข้อความ แล้วแอปจะแปลงเป็นข้อความให้ใส่ในช่อง <b>'+esc(label)+'</b>',onPages:pages=>show(pages)});
    const show=pages=>{
      const text=ocrText(pages);
      mb.innerHTML='<div class="note-box">อ่านด้วย '+esc(pages.engine||ocrEngName())+' — แก้ข้อความที่อ่านผิดก่อนใส่ (ลบส่วนที่ไม่ต้องการได้)</div>'+
        '<textarea class="inp ocr-tx" rows="10"></textarea>'+
        '<label class="chk"><input type="checkbox" data-join> รวมบรรทัดที่ตัดกลางประโยคเป็นย่อหน้าเดียว</label>'+
        (k==='work'?'':'<label class="chk"><input type="checkbox" data-dash> ขึ้นต้นแต่ละบรรทัดด้วย “-” (ทำเป็นข้อย่อย)</label>')+
        ocrThumbs(pages)+
        '<div class="acts2">'+(k==='work'?'<button class="btn" data-add type="button">'+ico('plus')+'เพิ่มเป็นรายการงาน (บรรทัดละ 1 งาน)</button>':'<button class="btn" data-app type="button">'+ico('plus')+'ใส่ต่อท้ายข้อความเดิม</button><button class="btn line sm" data-rep type="button">แทนที่ข้อความเดิม</button>')+
        '<button class="btn line sm" data-again type="button">'+ico('scan')+'อ่านภาพอื่น</button></div>';
      const tx=mb.querySelector('.ocr-tx'); tx.value=text;
      const jn=mb.querySelector('[data-join]'); jn.onchange=()=>{tx.value=jn.checked?text.split(/\n\s*\n/).map(p=>p.replace(/\s*\n\s*/g,' ')).join('\n'):text};
      const lines=()=>tx.value.split('\n').map(s=>s.trim()).filter(Boolean);

/* ---- ภาพรวมโครงการ / S-Curve ---- */
function sCurveSVG(pid,W,H){
  const pr=app.projects[pid], b=boqOf(pid), reps=projReports(pid);
  const act=reps.map(r=>{let v=null;if(b.items.length&&r.boqProg&&Object.keys(r.boqProg).length)v=boqActual(b,r.boqProg);else if(String(r.progress.actual).trim()!=='')v=num(r.progress.actual);return v==null?null:{d:r.date,v}}).filter(Boolean);
  let s=parseD(pr.start), e=(s&&parseInt(pr.days,10))?parseD(addDays(pr.start,parseInt(pr.days,10)-1)):null;
  b.items.forEach(i=>{const a=parseD(i.start),c=parseD(i.end);if(a&&(!s||a<s))s=a;if(c&&(!e||c>e))e=c});
  if(act.length){const f=parseD(act[0].d),l=parseD(act[act.length-1].d);if(!s||f<s)s=f;if(!e||l>e)e=l}
  if(!s||!e||e<=s) return '';
  const ml=38,mr=14,mt=18,mb=30,pw=W-ml-mr,ph=H-mt-mb, X=d=>ml+(d-s)/(e-s)*pw, Y=v=>mt+(1-Math.max(0,Math.min(100,v))/100)*ph;
  const N=Math.min(Math.round((e-s)/864e5)+1,90), plan=[]; let hasPlan=true;
  for(let k=0;k<=N;k++){const d=new Date(s.getTime()+(e-s)*k/N), v=planAt(pid,ymd(d));if(v==null){hasPlan=false;break}plan.push([X(d),Y(v)])}
  let g='';
  [0,25,50,75,100].forEach(v=>{g+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#e4e7e8"/><text x="'+(ml-6)+'" y="'+(Y(v)+4)+'" font-size="10" text-anchor="end" fill="#6b7478">'+v+'%</text>'});
  for(let k=0;k<=4;k++){const d=new Date(s.getTime()+(e-s)*k/4);g+='<text x="'+X(d)+'" y="'+(H-10)+'" font-size="10" text-anchor="'+(k===0?'start':k===4?'end':'middle')+'" fill="#6b7478">'+TH_MON_S[d.getMonth()]+' '+String(d.getFullYear()+543).slice(2)+'</text>'}
  if(hasPlan) g+='<polyline fill="none" stroke="#8a9ba0" stroke-width="2" stroke-dasharray="5 4" points="'+plan.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';
  const pts=act.map(a=>[X(parseD(a.d)),Y(a.v)]);
  if(pts.length) g+='<polyline fill="none" stroke="#0e5a6b" stroke-width="2.6" stroke-linejoin="round" points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>'+pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.4" fill="#0e5a6b"/>').join('');
  const t=new Date(); t.setHours(0,0,0,0); if(t>=s&&t<=e) g+='<line x1="'+X(t)+'" x2="'+X(t)+'" y1="'+mt+'" y2="'+(H-mb)+'" stroke="#b8641c" stroke-dasharray="2 3"/><text x="'+X(t)+'" y="'+(mt-5)+'" font-size="9.5" text-anchor="middle" fill="#b8641c">วันนี้</text>';
  g+='<g font-size="10.5"><line x1="'+(ml+6)+'" x2="'+(ml+26)+'" y1="'+(mt+8)+'" y2="'+(mt+8)+'" stroke="#8a9ba0" stroke-width="2" stroke-dasharray="5 4"/><text x="'+(ml+31)+'" y="'+(mt+12)+'" fill="#33403f">แผน</text><line x1="'+(ml+66)+'" x2="'+(ml+86)+'" y1="'+(mt+8)+'" y2="'+(mt+8)+'" stroke="#0e5a6b" stroke-width="2.6"/><text x="'+(ml+91)+'" y="'+(mt+12)+'" fill="#33403f">ผลงานจริง</text></g>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;font-family:var(--font)">'+g+'</svg>';
}

const H2I_URL='https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js';

let _fontCss=null,_fontKey='';
const FONT_URLS={
  plex:'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap',
  sarabun:'https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap'
};
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
/* ดึง CSS ฟอนต์จาก Google Fonts เอง แล้วแปลงไฟล์ฟอนต์เป็น data URL (เฉพาะส่วนภาษาไทย + ละติน) เพื่อฝังในภาพ PDF */
async function fontEmbedCSS(){
  const key=PF().font==='sarabun'?'sarabun':'plex';
  if(_fontCss&&_fontKey===key) return _fontCss;
  const cssText=await (await fetch(FONT_URLS[key],{mode:'cors'})).text();
  const blocks=(cssText.match(/@font-face\s*\{[^}]*\}/g)||[]).filter(b=>{const m=b.match(/unicode-range:\s*([^;]+);/i);return !m||/0E01|0E00|0000-00FF/i.test(m[1])});
  if(!blocks.length) throw new Error('ไม่พบข้อมูลฟอนต์');
  const out=await Promise.all(blocks.map(async b=>{
    const m=b.match(/url\(\s*['"]?([^'")]+)['"]?\s*\)/); if(!m) return b;
    const r=await fetch(m[1],{mode:'cors'}); if(!r.ok) throw new Error('โหลดไฟล์ฟอนต์ไม่สำเร็จ');
    return b.replace(m[1],await blobToDataURL(await r.blob()));
  }));
  _fontCss=out.join('\n');_fontKey=key;return _fontCss;
}
function segmentThai(root){
  const seg=(window.Intl&&Intl.Segmenter)?new Intl.Segmenter('th',{granularity:'word'}):null, nodes=[];
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>(n.parentNode&&(/^(SCRIPT|STYLE|TEXTAREA)$/i.test(n.parentNode.nodeName)||(n.parentNode.closest&&n.parentNode.closest('svg'))))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  while(tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(n=>{
    const t=n.nodeValue; if(!/[\u0E00-\u0E7F]/.test(t)||t.indexOf('\u200B')>=0) return;
    let out=''; if(seg){for(const x of seg.segment(t)) out+=x.segment+(x.isWordLike?'\u200B':'')} else out=t.replace(/([\u0E01-\u0E4E])([เแโใไ])/g,'$1\u200B$2');
    n.nodeValue=out;
  });
}
async function renderPageCanvas(el,w,h,ctx){
  if(!ctx.noH2I&&!IN_ARTIFACT){
    try{
      await loadScript(H2I_URL);
      if(ctx.css==null) ctx.css=await fontEmbedCSS();
      const opt={pixelRatio:2,backgroundColor:'#ffffff',width:w,height:h,fontEmbedCSS:ctx.css,cacheBust:false};
      if(isSafari&&!ctx.warm){ctx.warm=true;try{await htmlToImage.toCanvas(el,opt)}catch(e){}}
      return await htmlToImage.toCanvas(el,opt);
    }catch(e){
      console.warn('โหมดภาพ (html-to-image) ใช้ไม่ได้ สลับไปโหมดสำรอง',e);
      ctx.noH2I=true; toast('ฝังฟอนต์ไม่สำเร็จ — ใช้โหมดสำรอง (หากต้องการตัวอักษรคมที่สุด ให้เลือก “พิมพ์ผ่านเบราว์เซอร์” ในตั้งค่า)');
    }
  }
  if(!window.html2canvas) throw new Error('ไม่มีตัวสร้างภาพหน้า PDF');
  segmentThai(el);
  return html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,width:w,height:h,windowWidth:w,scrollX:0,scrollY:0,onclone:async d=>{try{await d.fonts.ready}catch(x){}}});
}

      '<div class="ctop-c"><h1>'+esc(cls.title)+'</h1>'+(vis('project')&&pr.name.trim()?'<div class="l2">'+nwSeg(pr.name)+'</div>':'')+'</div><div class="ctop-sp"></div></div>'+
      (vis('project')?'<div class="ctop-ln">'+(pr.location.trim()?'<div class="l3 fit">'+esc(pr.location.replace(/\s+/g,' ').trim())+'</div>':'')+(pr.extra.trim()?'<div class="l3 fit">'+esc(pr.extra.replace(/\s+/g,' ').trim())+'</div>':'')+(l4.length?'<div class="l4 fit">'+l4h+'</div>':'')+'</div>':'');
    return d;
  };
  const rowBase=cls_=>{const d=document.createElement('div');d.className='cr'+(cls_?' '+cls_:'');d.style.setProperty('--cols',cssCols);return d};
  const mkHead=()=>{const d=rowBase('h');d.innerHTML='<div class="cc">ว.ด.ป.</div>'+cols.map(c=>'<div class="cc">'+c.l+'</div>').join('');return d};
  const mkBlank=()=>{const d=rowBase('blank');d.innerHTML='<div class="cc"></div>'+cols.map(()=>'<div class="cc"></div>').join('');return d};
  const mkRow=r=>{const d=rowBase('');const dd=parseD(r.date);
    d.innerHTML='<div class="cc"><div class="dc"><b>'+esc(thDate(r.date,false))+'</b><small>วัน'+(dd?TH_DAYS[dd.getDay()]:'')+'</small></div></div>'+cols.map(c=>'<div class="cc">'+clsCell(c.k,r)+'</div>').join('');return d};
  const mkBottom=()=>{
    const showP=vis('progress'),showS=vis('sign'); if(!showP&&!showS) return null;
    const d=document.createElement('div');d.className='cbot';
    const pb=on=>'<span class="pb">(' +(on?ico('check'):'<u></u>')+')</span>';
    if(showP) d.innerHTML+='<div><h4>ผลการตรวจงาน</h4>'+['fast','normal','slow'].map(k=>'<div class="ck">'+pb(last.progress.status===k)+CLS_ST[k]+'</div>').join('')+(()=>{const p=last.progress,hp=String(p.plan).trim()!=='',ha=String(p.actual).trim()!=='';return (hp||ha)?'<span class="ref">แผนงานสะสม '+(hp?num(p.plan)+'%':'—')+' · ผลงานสะสม '+(ha?num(p.actual)+'%':'—')+'</span>':''})()+(reps.length>1?'<span class="ref">อ้างอิงรายงานล่าสุด วันที่ '+esc(thDate(last.date,false))+'</span>':'')+'</div>';
    if(showS){
      const slot=(n,s)=>'<div class="sg"><div class="sgl"><span>'+n+'. ลงชื่อ</span><span class="dots">'+(s&&s.img?'<img src="'+esc(s.img)+'" alt="">':'')+'</span></div><div class="sgn">'+(s&&s.name.trim()?'( '+esc(s.name)+' )':'(<i></i>)')+'</div><div class="sgp">'+esc(s?s.pos:'')+'</div></div>';
      const SS=ensureSigners(last);
      d.innerHTML+='<div><h4>'+esc(pf.sigLabels.client||'')+'</h4>'+SS.client.map((x,i)=>slot(i+1,x)).join('')+'</div>';
      d.innerHTML+='<div><h4>'+esc(pf.sigLabels.contractor||'')+'</h4>'+SS.contractor.map((x,i)=>slot(i+1,x)).join('')+'</div>';
    }
    return d;
  };
  // ----- วัดขนาด -----
  const M=document.createElement('div');M.className='cmeasure';host.appendChild(M);
  const topF=mkTop(true),topC=mkTop(false),headM=mkHead(),blankM=mkBlank(),rowEls=reps.map(mkRow),botEl=mkBottom(),soEl=buildSigOnly(last);
  const ctM=document.createElement('div');ctM.className='ct';ctM.append(headM,...rowEls,blankM);
  M.append(topF,topC,ctM);if(botEl)M.appendChild(botEl);if(soEl)M.appendChild(soEl);
  // ภาพประกอบ (ต่อท้าย)
  const photoBlocks=[];
  if(o.photos) reps.forEach(r=>{
    if(!r.photos.length) return;
    const c=3,rows=[];
    for(let i=0;i<r.photos.length;i+=c) rows.push('<div class="phr" style="--c:'+c+';--mh:230px">'+r.photos.slice(i,i+c).map(p=>'<div class="pic"><div class="pi"><img src="'+esc(p.src)+'" alt=""></div><div class="cap">'+esc(p.cap)+'</div></div>').join('')+'</div>');
    chain('image','ภาพประกอบ — '+thDate(r.date),'',rows).forEach(b=>photoBlocks.push(b));
  });

  await raf2(); await imgsReady(M);
  fitLines(topF);
  const hF=topF.offsetHeight,hC=topC.offsetHeight,hH=headM.offsetHeight,hBl=blankM.offsetHeight,hB=botEl?botEl.offsetHeight:0,hS=soEl?soEl.offsetHeight+10:0,hR=rowEls.map(e=>e.offsetHeight),hP=photoBlocks.map(b=>b.offsetHeight);
  const CAP=CCH-6, CAPR=CAP-hS; let pages=[{full:true,rows:[],blank:0,bottom:false}],used=hF+hH+2;
  rowEls.forEach((el,i)=>{
    let cur=pages[pages.length-1];
    if(used+hR[i]>CAPR&&cur.rows.length){cur={full:false,rows:[],blank:0,bottom:false};pages.push(cur);used=hC+hH+2}
    cur.rows.push(el);used+=hR[i];
  });
  let cur=pages[pages.length-1];
  if(o.fill){const n=Math.floor((CAP-used-hB)/hBl);if(n>0){cur.blank=n;used+=n*hBl}}
  if(botEl){ if(used+hB<=CAP) cur.bottom=true; else pages.push({full:false,rows:[],blank:0,bottom:true,noTable:true}) }

  // ----- ประกอบหน้า -----
  const out=[];
  pages.forEach(pg=>{
    const p=document.createElement('div');p.className='cpg';
    p.appendChild(pg.full?topF:mkTop(false));

      const ct=document.createElement('div');ct.className='ct';ct.appendChild(mkHead());

      p.appendChild(ct);
    }
    if(pg.bottom) p.appendChild(botEl); else if(soEl) p.appendChild(soEl.cloneNode(true));
    out.push(p);
  });
  if(photoBlocks.length){
    let pp=null,u=0;
    photoBlocks.forEach((b,i)=>{
      if(!pp||u+hP[i]>CAPR-hC){pp=document.createElement('div');pp.className='cpg';pp.appendChild(mkTop(false));if(soEl)pp.appendChild(soEl.cloneNode(true));out.push(pp);u=0}
      const so2=pp.querySelector(':scope>.so'); if(so2)pp.insertBefore(b,so2); else pp.appendChild(b); u+=hP[i];
    });
  }
  out.forEach((p,i)=>{
    const f=document.createElement('div');f.className='cfoot';
    f.innerHTML='<span>'+esc(cls.title+(pr.name.trim()?' · '+pr.name:''))+'</span><span>หน้า '+(i+1)+' / '+out.length+'</span>';
    p.appendChild(f);host.appendChild(p);
  });
  M.remove();
  return host;
}

    mb.querySelectorAll('#cScope button').forEach(x=>x.onclick=()=>{scope=x.dataset.v;upd()});
    $('cFrom').onchange=upd;$('cTo').onchange=upd;upd();

}

function tintLogo(src,color){
  return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,c.width,c.height);res(c.toDataURL('image/png'))};im.onerror=rej;im.src=src});
}
function uiSwHTML(){
  const cur=PF().uiMode==='desktop'?'desktop':'mobile';
  return ['mobile','desktop'].map(m=>'<button type="button" data-ui="'+m+'" class="'+(cur===m?'on':'')+'" aria-label="'+(m==='mobile'?'หน้าจอมือถือ':'หน้าจอคอมพิวเตอร์')+'">'+ico(m==='mobile'?'phone':'monitor')+'<span>'+(m==='mobile'?'มือถือ':'คอมพิวเตอร์')+'</span></button>').join('');
}
function applyUiMode(){
  const m=PF().uiMode==='desktop'?'desktop':'mobile';
  document.documentElement.dataset.ui=m;
  const vp=document.querySelector('meta[name=viewport]');
  if(vp) vp.setAttribute('content',(m==='desktop'&&Math.min(screen.width||9999,window.innerWidth)<900)?'width=1180':'width=device-width, initial-scale=1');
  document.querySelectorAll('[data-ui]').forEach(b=>b.classList.toggle('on',b.dataset.ui===m));
}
function setUiMode(m){
  if(!app||(PF().uiMode===m)) return;
  PF().uiMode=m; save(); applyUiMode();
  toast(m==='desktop'?'สลับเป็นหน้าจอคอมพิวเตอร์ (Desktop UI)':'สลับเป็นหน้าจอมือถือ (Mobile UI)');
}

function renderJump(){
  const j=$('jump'); if(!j) return;
  j.innerHTML=SECTIONS.filter(x=>vis(x.k)).map(x=>'<button type="button" data-j="'+x.k+'">'+JUMP[x.k]+'</button>').join('');
  j.querySelectorAll('button').forEach(b=>b.onclick=()=>{const c=$('sec-'+b.dataset.j);if(c)c.scrollIntoView({behavior:'smooth',block:'start'})});
}

/* ============ ประกาศเขตการให้ความช่วยเหลือผู้ประสบภัยพิบัติกรณีฉุกเฉิน ============
   กรอกประกาศครั้งเดียว (ประเภทภัย พื้นที่ อำเภอ/ตำบล/หมู่ ช่วงวันที่) → ทุกรายงานของโครงการที่อยู่ในพื้นที่
   และวันที่อยู่ในช่วงประกาศ จะมีข้อความในช่อง “ปัญหาและอุปสรรค” ให้อัตโนมัติ (ผู้ใช้ลบ/แก้ได้)
   app.disasters[id] = {id,type,typeOther,province,no,signed,start,end,areas:[{amphoe,tambon,moos}],src,note,created}
   r.dz[id] = ข้อความที่แอปใส่ให้ · r.dzOff[id] = ผู้ใช้ลบออกเอง (ไม่ใส่ซ้ำ) */
const DZ_TYPES=['อุทกภัย','วาตภัย','ดินโคลนถล่ม','อุทกภัย วาตภัย และดินโคลนถล่ม','ภัยแล้ง','อัคคีภัย','อื่น ๆ'];
const DZ_PROV_DEF='นครศรีธรรมราช';
const stripPre=(s,re)=>String(s||'').replace(re,'').replace(/\s+/g,' ').trim();
const normAmp=s=>stripPre(s,/^\s*(อ\.|อำเภอ|เขต)\s*/).toLowerCase();
const normProv=s=>stripPre(s,/^\s*(จ\.|จังหวัด)\s*/).toLowerCase();
const parseMoos=s=>[...new Set(String(s||'').replace(/หมู่ที่|หมู่|ม\./g,' ').split(/[\s,，、และ]+/).flatMap(t=>{const m=t.match(/^(\d+)\s*[-–]\s*(\d+)$/);if(m){const a=+m[1],b=+m[2];return b>=a&&b-a<60?Array.from({length:b-a+1},(_,i)=>String(a+i)):[]}return /^\d+$/.test(t)?[String(+t)]:[]}))];
function parseLoc(loc){
  const s=String(loc||''), g=re=>{const m=s.match(re);return m?m[1]:''};
  return {moo:g(/(?:หมู่ที่|หมู่|ม\.)\s*(\d+)/),tambon:g(/(?:ต\.|ตำบล|แขวง)\s*([^\s,]+)/),amphoe:g(/(?:อ\.|อำเภอ|เขต)\s*([^\s,]+)/),province:g(/(?:จ\.|จังหวัด)\s*([^\s,]+)/)};
}
const dzType=d=>d.type==='อื่น ๆ'?(String(d.typeOther||'').trim()||'สาธารณภัย'):d.type;
function dzMatch(d,p,date){ // → {ok, needMoo, area}
  if(!d||!p||!date||!d.start||date<d.start||(d.end&&date>d.end)) return {ok:false};
  if(normProv(d.province)&&normProv(p.province)&&normProv(d.province)!==normProv(p.province)) return {ok:false};
  const t=projArea(p); if(!t) return {ok:false};
  let need=null;
  for(const a of (d.areas||[])){
    if(normArea(a.tambon)!==t) continue;
    if(normAmp(a.amphoe)&&normAmp(p.amphoe)&&normAmp(a.amphoe)!==normAmp(p.amphoe)) continue;
    const ms=parseMoos(a.moos);
    if(!ms.length) return {ok:true,area:a};
    const pm=parseMoos(p.moo)[0];
    if(pm&&ms.includes(pm)) return {ok:true,area:a};
    if(!pm) need=a;
  }
  return {ok:false,needMoo:need};
}
function dzLine(d){
  const prov=stripPre(d.province,/^\s*(จ\.|จังหวัด)\s*/)||DZ_PROV_DEF;
  return '- อยู่ในช่วงประกาศเขตการให้ความช่วยเหลือผู้ประสบภัยพิบัติกรณีฉุกเฉิน ('+dzType(d)+') ตามประกาศจังหวัด'+prov+
    (String(d.no||'').trim()?' ที่ '+String(d.no).trim():'')+(d.signed?' ลงวันที่ '+thDate(d.signed,false):'')+
    ' (มีผล '+thDate(d.start,false)+(d.end?' – '+thDate(d.end,false):' จนกว่าจะยกเลิก')+')';
}
const dzRemoveLine=(txt,line)=>txt.split('\n').filter(x=>x!==line).join('\n').replace(/^\n+/,'');
function dzApply(r){
  if(!app.disasters) app.disasters={};
  const p=app.projects[r.projectId]; if(!p) return false;
  let txt=String(r.issues||''), ch=false;
  const dz=r.dz&&typeof r.dz==='object'?r.dz:{};
  for(const id of Object.keys(dz)){
    const line=dz[id], d=app.disasters[id], m=d?dzMatch(d,p,r.date):{ok:false};
    if(!txt.split('\n').includes(line)){ // ผู้ใช้ลบหรือแก้ข้อความเอง → ไม่ใส่ซ้ำ
      if(m.ok){r.dzOff=r.dzOff||{};r.dzOff[id]=1}
      delete dz[id]; ch=true; continue;
    }
    const want=m.ok?dzLine(d):null;
    if(want!==line){txt=want?txt.split('\n').map(x=>x===line?want:x).join('\n'):dzRemoveLine(txt,line);if(want)dz[id]=want;else delete dz[id];ch=true}
  }
  Object.values(app.disasters).sort((a,b)=>String(a.start).localeCompare(String(b.start))).forEach(d=>{
    if(dz[d.id]||(r.dzOff&&r.dzOff[d.id])) return;
    if(!dzMatch(d,p,r.date).ok) return;
    const line=dzLine(d);
    if(!txt.split('\n').includes(line)) txt=line+(txt.trim()?'\n'+txt:'');
    dz[d.id]=line; ch=true;
  });
  if(r.dzOff) Object.keys(r.dzOff).forEach(id=>{if(!app.disasters[id]){delete r.dzOff[id];ch=true}});
  if(ch){r.issues=txt;if(Object.keys(dz).length)r.dz=dz;else delete r.dz;if(r.dzOff&&!Object.keys(r.dzOff).length)delete r.dzOff}
  return ch;
}
function dzApplyAll(){if(!app.disasters||typeof app.disasters!=='object')app.disasters={};let n=0;Object.values(app.reports).forEach(r=>{if(dzApply(r))n++});return n}
const dzActive=d=>{const t=todayS();return d.start<=t&&(!d.end||d.end>=t)};
const dzAreaTxt=d=>(d.areas||[]).map(a=>(String(a.moos||'').trim()?'ม.'+parseMoos(a.moos).join(','):'ทั้งตำบล')+' ต.'+stripPre(a.tambon,/^\s*(ต\.|ตำบล|แขวง)\s*/)+(String(a.amphoe||'').trim()?' อ.'+stripPre(a.amphoe,/^\s*(อ\.|อำเภอ|เขต)\s*/):'')).join(' · ');
function dzProjects(d){return Object.values(app.projects).filter(p=>Object.values(app.reports).some(r=>r.projectId===p.id&&dzMatch(d,p,r.date).ok)||dzMatch(d,p,d.start).ok||dzMatch(d,p,todayS()).ok)}

  function h53(s){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
    a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);
    return (b>>>0).toString(36)+(a>>>0).toString(36)}

  const isImg=v=>typeof v==='string'&&v.length>40&&v.startsWith('data:image/');

  function walk(o,fn,d=0){if(!o||typeof o!=='object'||d>14)return;for(const k of Object.keys(o)){const v=o[k];if(typeof v==='string'){const r=fn(v);if(r!==undefined)o[k]=r}else walk(v,fn,d+1)}}

    WEAK_PASSWORD:'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร',TOO_MANY_ATTEMPTS_TRY_LATER:'ลองผิดหลายครั้งเกินไป กรุณารอสักครู่แล้วลองใหม่',
    USER_DISABLED:'บัญชีนี้ถูกระงับ',OPERATION_NOT_ALLOWED:'ผู้ดูแลยังไม่เปิดการเข้าสู่ระบบด้วยอีเมลใน Firebase',

    'API key not valid. Please pass a valid API key.':'API Key ของ Firebase ไม่ถูกต้อง (ติดต่อผู้ดูแล)'};
  const thMsg=e=>{const m=String(e&&e.message||e);const k=m.split(/[ :]/)[0];

    catch(e){if(e.status===401&&retry){auth.exp=0;return fs(path,body,false)}throw e}
  }
  async function loadMeta(){meta=(auth&&await dbGet('sync:meta:'+auth.uid).catch(()=>null))||{r:{},up:{},cur:'',last:0};meta.r=meta.r||{};meta.up=meta.up||{}}
  const saveMeta=()=>auth&&meta?dbSet('sync:meta:'+auth.uid,meta):null;

  /* ---------- ข้อมูลในเครื่อง → รายการซิงค์ ---------- */
  function localRecs(){
    const m=new Map(); const pf={...app.profile}; delete pf.uiMode;
    m.set('pf',pf);
    for(const id of Object.keys(app.projects)) m.set('p_'+id,app.projects[id]);
    for(const id of Object.keys(app.reports)) m.set('r_'+id,app.reports[id]);
    for(const id of Object.keys(app.weather||{})) m.set('w_'+id,app.weather[id]);
    for(const id of Object.keys(app.disasters||{})) m.set('d_'+id,app.disasters[id]);
    return m;
  }
  function isPristine(){
    const rs=Object.values(app.reports), ps=Object.values(app.projects), pf=PF();
    if(rs.length>1||ps.length>1||pf.org||pf.logo) return false;
    const p=ps[0]; if(p&&(p.name||p.client||p.contractor||p.location||p.contractNo||(p.boq&&p.boq.items&&p.boq.items.length))) return false;
    const r=rs[0]; if(!r) return true;
    return !(r.work.some(w=>String(w.t||'').trim())||r.photos.length||r.materials.length||String(r.inspect||'').trim()||String(r.issues||'').trim()||String(r.nextplan||'').trim()||r.workforce.length||r.machines.length||r.weather.sel.length);
  }
  function applyRec(key,obj){
    if(key==='pf'){if(obj){const ui=PF().uiMode;app.profile=normProfile(obj,ui)}return}
    if(!app.weather) app.weather={}; if(!app.disasters) app.disasters={};
    const coll=key.startsWith('p_')?app.projects:key.startsWith('r_')?app.reports:key.startsWith('w_')?app.weather:key.startsWith('d_')?app.disasters:null; if(!coll) return;
    const id=key.slice(2); if(BADK.has(id)) return;
    if(!obj){delete coll[id];return}
    if(key.startsWith('r_')){if(!obj.projectId||typeof obj.date!=='string') return; obj.id=id}
    coll[id]=obj;
  }
  function fixup(){
    Object.values(app.reports).forEach(r=>{
      if(r.inspect==null)r.inspect='';
      if(!app.projects[r.projectId]){const p=newProject();p.id=r.projectId;app.projects[p.id]=p}
    });
    Object.values(app.projects).forEach(p=>{if(p.extra==null)p.extra=''});
    migrateSigners(); wxApplyAll(); dzApplyAll();
    if(!Object.keys(app.reports).length){const pid=Object.keys(app.projects)[0]||(()=>{const p=newProject();app.projects[p.id]=p;return p.id})();const n=makeReport(pid,todayS(),null);app.reports[n.id]=n}
    if(!app.reports[app.cur]) app.cur=Object.values(app.reports).sort((a,b)=>b.date.localeCompare(a.date))[0].id;
  }

  /* ---------- ภาพ ---------- */
  async function fetchImgs(hs){
    const names=[];hs.forEach(h=>{for(let i=0;i<nChunks(h);i++)names.push(userPath()+'/imgs/'+docId(h)+'_'+i)});
    const parts={};
    for(let i=0;i<names.length;i+=8){
      const res=await fs(':batchGet',{documents:names.slice(i,i+8)});
      (res||[]).forEach(x=>{if(x.found){parts[x.found.name]=((x.found.fields||{}).d||{}).stringValue||''}});
    }
    hs.forEach(h=>{let s='';for(let i=0;i<nChunks(h);i++){const p=parts[userPath()+'/imgs/'+docId(h)+'_'+i];if(p==null){s=null;break}s+=p}
      if(s&&safeImg(s)){byH.set(h,s);imgH.set(s,h);meta.up[h]=1}});
  }
  async function deser(j){
    const o=JSON.parse(j), need=new Set();
    walk(o,v=>{if(v.startsWith(TOK)){const h=v.slice(TOK.length);if(!byH.has(h))need.add(h)}});
    if(need.size) await fetchImgs([...need]);
    walk(o,v=>v.startsWith(TOK)?(byH.get(v.slice(TOK.length))||''):undefined);
    return o;
  }
  function imgWrites(hs){
    const w=[];
    hs.forEach(h=>{const s=byH.get(h);if(!s)return;const n=nChunks(h);for(let i=0;i<n;i++)w.push({h,size:Math.min(CH,s.length-i*CH),write:{update:{name:userPath()+'/imgs/'+docId(h)+'_'+i,fields:{d:{stringValue:s.slice(i*CH,(i+1)*CH)},n:{integerValue:String(n)}}}}})});
    return w;
  }
  async function commit(list){ // list: [{write,size,done(result)}] → ส่งเป็นชุด ไม่เกิน ~4 MB / 200 รายการ
    let batch=[],sz=0;
    const flush=async()=>{if(!batch.length)return;const res=await fs(':commit',{writes:batch.map(x=>x.write)});const wr=(res&&res.writeResults)||[];batch.forEach((x,i)=>x.done&&x.done(wr[i]||{},res));batch=[];sz=0};
    for(const x of list){if(batch.length&&(sz+x.size>4e6||batch.length>=200))await flush();batch.push(x);sz+=x.size}
    await flush();
  }

  /* ---------- รอบซิงค์ ---------- */
  async function pass(first){
    if(!auth||!configured()) return;
    if(busy){again=true;return}
    busy=true; clearTimeout(timer);
    if(!navigator.onLine){busy=false;set('err','ออฟไลน์ — จะซิงค์เมื่อมีอินเทอร์เน็ต');return}
    set('wait','กำลังซิงค์…');
    try{
      if(!meta) await loadMeta();
      const fresh=!meta.cur&&!Object.keys(meta.r).length;
      /* 1) หารายการที่แก้ในเครื่อง */
      let loc=localRecs(); const snap=new Map(), dirty=new Set(), gone=new Set();
      for(const [k,o] of loc){const imgs=new Set(),j=ser(o,imgs),h=h53(j)+j.length.toString(36);snap.set(k,{j,h,imgs});
        const m=meta.r[k]; if(!m||m.h!==h){dirty.add(k);if(m&&m.d==null)m.d=lastEdit||Date.now()}}
      for(const k of Object.keys(meta.r)){if(meta.r[k].h!=='DEL'&&!loc.has(k)){gone.add(k);if(meta.r[k].d==null)meta.r[k].d=lastEdit||Date.now()}}
      /* 2) ดึงของใหม่จากเซิร์ฟเวอร์ */
      const q={structuredQuery:{from:[{collectionId:'recs'}]}};
      if(meta.cur){const since=new Date(Date.parse(meta.cur)-120000).toISOString();q.structuredQuery.where={fieldFilter:{field:{fieldPath:'u'},op:'GREATER_THAN_OR_EQUAL',value:{timestampValue:since}}}}
      const rows=(await fs('/users/'+auth.uid+':runQuery',q)||[]).filter(x=>x.document).map(x=>{const f=x.document.fields||{};const u=(f.u&&f.u.timestampValue)||x.document.updateTime;
        return {key:(f.key&&f.key.stringValue)||'',j:(f.j&&f.j.stringValue)||'',del:!!(f.del&&f.del.booleanValue),u,ms:Date.parse(u)||0}}).filter(x=>x.key);
      let maxMs=Date.parse(meta.cur)||0;
      if(fresh&&isPristine()&&rows.some(x=>x.key.startsWith('r_')&&!x.del)){
        app.projects={};app.reports={};app.weather={};app.disasters={};dirty.clear();loc=new Map();
      }
      if(fresh){rows.forEach(x=>{if(dirty.has(x.key)&&!meta.r[x.key])meta.r[x.key]={h:'',d:0}})}  // เครื่องใหม่: ถ้าชนกัน ให้ข้อมูลบนเซิร์ฟเวอร์ชนะ
      const changed=[];
      for(const x of rows){
        if(x.ms>maxMs) maxMs=x.ms;
        const m=meta.r[x.key];
        if(m&&m.s===x.u) continue;
        if(dirty.has(x.key)||gone.has(x.key)){const ld=m&&m.d!=null?m.d:0;if(ld>x.ms)continue}
        let obj=null;
        if(!x.del){try{obj=cleanData(await deser(x.j))}catch(e){console.warn('skip',x.key,e);continue}}
        applyRec(x.key,obj); dirty.delete(x.key); gone.delete(x.key);
        meta.r[x.key]={h:x.del?'DEL':'',s:x.u}; changed.push(x.key);
      }
      if(maxMs) meta.cur=new Date(maxMs).toISOString();
      if(changed.length){
        fixup(); loc=localRecs();
        changed.forEach(k=>{const o=loc.get(k);if(o){const j=ser(o);meta.r[k].h=h53(j)+j.length.toString(36)}else meta.r[k].h='DEL'});
        await dbSet('app',app); await saveMeta(); refreshUI(changed);
      }
      /* 3) ส่งของที่แก้ในเครื่องขึ้นเซิร์ฟเวอร์ */
      if(gone.size>10&&gone.size>Object.keys(meta.r).length*0.5){
        gone.clear(); toast('ข้ามการลบรายการจำนวนมากบนเซิร์ฟเวอร์เพื่อความปลอดภัย — ถ้าตั้งใจลบ ให้ลบทีละรายการ');
      }
      const recW=[], needImg=new Set();
      for(const k of dirty){const s=snap.get(k);if(!s)continue;
        const bytes=s.j.length>250000?new TextEncoder().encode(s.j).length:s.j.length*3;
        if(bytes>1040000){toast('รายการ '+k+' ใหญ่เกินกว่าจะซิงค์ได้ (เกิน 1 MB ไม่รวมภาพ)');continue}
        s.imgs.forEach(h=>{if(!meta.up[h])needImg.add(h)});
        recW.push({size:bytes+300,write:{update:{name:userPath()+'/recs/'+docId(k),fields:{key:{stringValue:k},j:{stringValue:s.j},del:{booleanValue:false},dev:{stringValue:devId},ver:{stringValue:APP_VER}}},updateTransforms:[{fieldPath:'u',setToServerValue:'REQUEST_TIME'}]},
          done:r=>{const u=r.transformResults&&r.transformResults[0]&&r.transformResults[0].timestampValue;meta.r[k]={h:s.h,s:u||''}}});
      }
      for(const k of gone){
        recW.push({size:200,write:{update:{name:userPath()+'/recs/'+docId(k),fields:{key:{stringValue:k},j:{stringValue:''},del:{booleanValue:true},dev:{stringValue:devId},ver:{stringValue:APP_VER}}},updateTransforms:[{fieldPath:'u',setToServerValue:'REQUEST_TIME'}]},
          done:r=>{const u=r.transformResults&&r.transformResults[0]&&r.transformResults[0].timestampValue;meta.r[k]={h:'DEL',s:u||''}}});
      }
      if(needImg.size){const iw=imgWrites(needImg);const left={};iw.forEach(x=>{left[x.h]=(left[x.h]||0)+1;x.done=()=>{if(--left[x.h]===0)meta.up[x.h]=1}});await commit(iw);await saveMeta()}
      if(recW.length) await commit(recW);
      meta.last=Date.now(); await saveMeta(); errShown=false;
      set('ok','ซิงค์แล้ว '+hhmm()+(recW.length||changed.length?' · ส่ง '+recW.length+' · รับ '+changed.length:''));
    }catch(e){
      (e&&e.code==='NET'?console.warn:console.error)(e); const m=thMsg(e);
      set(e.code==='NET'?'err':(auth?'err':'off'),m);
      if(!errShown&&e.code!=='NET'&&e.code!=='AUTH'){errShown=true;toast(m)}
      try{await saveMeta()}catch(x){}
    }finally{
      busy=false;
      if(again){again=false;schedule(1500)}
    }
  }
  function refreshUI(changed){
    try{
      $('h-title').value=PF().docTitle; applyFont();
      const ae=document.activeElement, typing=ae&&$('form').contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);
      if(curView==='home') renderHome();
      else if(!typing) renderForm(); else renderBar();
      if(changed.length) toast('รับข้อมูลจากเครื่องอื่น '+changed.length+' รายการ');
    }catch(e){console.error(e)}
  }
  function schedule(ms){if(!auth)return;clearTimeout(timer);timer=setTimeout(()=>pass(),ms)}
  function changed(){lastEdit=Date.now();if(auth){set('wait','รอซิงค์…');schedule(4000)}}

  async function start(){
    const saved=await dbGet('sync:cfg').catch(()=>null);
    cfg=parseCfg(JSON.stringify(saved||{}))||parseCfg(JSON.stringify(SYNC_DEFAULT))||null;
    auth=await dbGet('sync:auth').catch(()=>null)||null;
    if(auth&&configured()){await loadMeta();set('wait','กำลังซิงค์…');setTimeout(()=>pass(),600)}
    else{auth=auth&&configured()?auth:null;set('off',configured()?'ยังไม่ได้เข้าสู่ระบบ':'ยังไม่ได้ตั้งค่าเซิร์ฟเวอร์ซิงค์')}
    setInterval(()=>{if(auth&&document.visibilityState==='visible')pass()},60000);
    window.addEventListener('online',()=>schedule(500));
    document.addEventListener('visibilitychange',()=>{if(!auth)return;if(document.visibilityState==='visible')schedule(300);else if(timer){clearTimeout(timer);pass()}});
    if(configured()&&!auth){let asked=null;try{asked=localStorage.getItem('dr-login-asked')}catch(e){}if(!asked){try{localStorage.setItem('dr-login-asked','1')}catch(e){}setTimeout(()=>{if(modal.hidden)openAccount()},900)}}
  }
  async function setCfg(text){
    const c=text?parseCfg(text):null; if(text&&!c) throw new Error('bad');
    if(auth&&c&&cfg&&c.projectId!==cfg.projectId) await logout(false);
    cfg=c||parseCfg(JSON.stringify(SYNC_DEFAULT)); await dbSet('sync:cfg',c);
    set(auth?'wait':'off',configured()?(auth?'กำลังซิงค์…':'ยังไม่ได้เข้าสู่ระบบ'):'ยังไม่ได้ตั้งค่าเซิร์ฟเวอร์ซิงค์');
  }
  return {start,login,logout,resetPw,pass,changed,setCfg,thMsg,paintBadges,
    get state(){return st},get user(){return auth&&{email:auth.email,uid:auth.uid}},get configured(){return configured()},
    get cfg(){return cfg},get builtIn(){return !!parseCfg(JSON.stringify(SYNC_DEFAULT))},get last(){return meta&&meta.last},
    on(f){listeners.add(f);return()=>listeners.delete(f)}};
})();

      $('syCfgClr').onclick=async()=>{await Sync.setCfg('');draw()};
    };
    draw();
  });
}

/* ============ เวอร์ชันและการอัปเดต ============
   APP_INFO ถูกเขียนทับตอน build (scripts/build-www.mjs) จาก version.json + เลขรอบ build ของ GitHub
   ตรวจอัปเดตจาก GitHub Releases ของ repo (ต้องเป็น public repo) ผ่าน api.github.com */
const APP_PLATFORM=(()=>{try{if(window.Capacitor&&Capacitor.getPlatform&&Capacitor.getPlatform()==='android')return 'android'}catch(e){}
  return /Electron/i.test(navigator.userAgent)?'windows':'web'})();
const PLAT_TH={android:'แอป Android (APK)',windows:'โปรแกรม Windows (.exe)',web:'เว็บเบราว์เซอร์ (ไฟล์ HTML)'};
const verTxt=()=>'เวอร์ชัน '+APP_VER+(APP_INFO.build?' รุ่น '+APP_INFO.build:'');
const Upd=(()=>{
  let latest=null, st='idle', err='', last=0, shown=false;
  const cmp=(a,b)=>{const x=String(a).split('.').map(n=>parseInt(n,10)||0),y=String(b).split('.').map(n=>parseInt(n,10)||0);
    for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0};
  const isNewer=l=>!!l&&!!l.ver&&(cmp(l.ver,APP_VER)>0||(cmp(l.ver,APP_VER)===0&&APP_INFO.build>0&&l.build>APP_INFO.build));
  function paint(){document.querySelectorAll('[data-upd-dot]').forEach(e=>e.hidden=st!=='new')}
  async function check(){
    if(!APP_INFO.repo){st='norepo';err='ไฟล์นี้ไม่ได้สร้างจาก GitHub จึงตรวจอัปเดตอัตโนมัติไม่ได้';paint();return null}
    st='wait'; err='';
    let r;
    try{r=await fetch('https://api.github.com/repos/'+APP_INFO.repo+'/releases/latest',{headers:{Accept:'application/vnd.github+json'},cache:'no-store'})}
    catch(e){st='err';err='ไม่มีการเชื่อมต่ออินเทอร์เน็ต';paint();return null}
    if(r.status===404){st='err';err='ไม่พบไฟล์อัปเดตบน GitHub (repo อาจยังเป็นแบบ Private หรือยังไม่เคยเผยแพร่เวอร์ชัน)';paint();return null}
    if(r.status===403||r.status===429){st='err';err='ตรวจบ่อยเกินไป กรุณาลองใหม่ในอีกสักครู่';paint();return null}
    if(!r.ok){st='err';err='ตรวจอัปเดตไม่สำเร็จ (HTTP '+r.status+')';paint();return null}
    let j; try{j=await r.json()}catch(e){st='err';err='ข้อมูลอัปเดตไม่ถูกต้อง';paint();return null}
    const ver=String(j.tag_name||'').replace(/^v/i,'').split('-')[0].trim();
    const bm=(String(j.name||'')+' '+String(j.body||'')).match(/(?:build|รุ่น)\s*(\d+)/i);
    const A=(Array.isArray(j.assets)?j.assets:[]).filter(a=>a&&/^https:\/\/github\.com\//.test(a.browser_download_url||'')).map(a=>({n:String(a.name),u:a.browser_download_url,s:+a.size||0}));
    const pick=re=>A.find(a=>re.test(a.n))||null;
    latest={ver,build:bm?+bm[1]:0,date:j.published_at||'',page:/^https:\/\/github\.com\//.test(j.html_url||'')?j.html_url:'',
      notes:String(j.body||'').replace(/\r/g,'').split('\n').filter(l=>!/^\s*(build|รุ่น)\s*:?\s*\d+\s*$/i.test(l)).join('\n').trim().slice(0,3000),
      apk:pick(/\.apk$/i),exe:pick(/setup.*\.exe$/i),portable:pick(/portable.*\.exe$/i),web:pick(/\.html$/i)};
    st=isNewer(latest)?'new':'latest'; last=Date.now();
    try{localStorage.setItem('dr-upd-last',String(last));localStorage.setItem('dr-upd-cache',JSON.stringify(latest))}catch(e){}
    paint(); if(curView==='home') renderHome();
    return latest;
  }
  function auto(){
    try{last=+localStorage.getItem('dr-upd-last')||0;const c=JSON.parse(localStorage.getItem('dr-upd-cache')||'null');if(c&&c.ver){latest=c;st=isNewer(c)?'new':'latest'}}catch(e){}
    paint();
    if(APP_INFO.repo&&Date.now()-last>6*3600e3) setTimeout(()=>{check().then(()=>{if(st==='new'&&!shown){shown=true;toast('มีเวอร์ชันใหม่ '+latest.ver+' — แตะ “เกี่ยวกับแอป / อัปเดต” ในเมนูตั้งค่า')}}).catch(()=>{})},3000);
  }
  return {check,auto,paint,isNewer,get latest(){return latest},get st(){return st},get err(){return err},get last(){return last}};
})();
function openExt(u){
  if(!/^https:\/\//.test(String(u||''))) return;
  if(APP_PLATFORM==='android') location.href=u;        // แอป Android: เปิดเบราว์เซอร์ของเครื่องเพื่อดาวน์โหลด
  else window.open(u,'_blank','noopener');               // Windows / เว็บ: เปิดในเบราว์เซอร์
}
const fmtMB=b=>b?' · '+(b/1048576).toFixed(b>10485760?0:1)+' MB':'';
function openAbout(){
  openModal('เกี่ยวกับแอป / อัปเดต',mb=>{
    const draw=()=>{
      if(modal.hidden||$('mt').textContent!=='เกี่ยวกับแอป / อัปเดต') return;
      const l=Upd.latest, s=Upd.st;
      let box='';
      if(s==='wait') box='<div class="stbox">กำลังตรวจหาอัปเดต…</div>';
      else if(s==='new'&&l){
        const main=APP_PLATFORM==='android'?l.apk:APP_PLATFORM==='windows'?l.exe:l.web;
        const how=APP_PLATFORM==='android'?'กด “ดาวน์โหลด” → เมื่อโหลดเสร็จ แตะไฟล์ .apk → <b>อัปเดต/ติดตั้ง</b> ทับของเดิม (ข้อมูลไม่หาย)'
          :APP_PLATFORM==='windows'?'กด “ดาวน์โหลด” → ปิดโปรแกรมนี้ → ดับเบิลคลิกไฟล์ Setup ที่ได้ ติดตั้งทับของเดิม (ข้อมูลไม่หาย)'
          :'กด “ดาวน์โหลด” → เปิดไฟล์ daily-report.html ใหม่แทนไฟล์เดิม (ข้อมูลอยู่ในเบราว์เซอร์และบนบัญชี ไม่หาย)';
        box='<div class="stbox upd-new"><b>มีเวอร์ชันใหม่ '+esc(l.ver)+(l.build?' รุ่น '+l.build:'')+'</b>'+(l.date?'<small> · เผยแพร่ '+esc(thDate(l.date.slice(0,10),false))+'</small>':'')+
          (l.notes?'<div class="upd-notes">'+esc(l.notes)+'</div>':'')+
          '<div class="acts" style="margin-top:12px">'+(main?'<button class="btn" type="button" data-dl="'+esc(main.u)+'">'+ico('dl')+'ดาวน์โหลด '+esc(main.n)+fmtMB(main.s)+'</button>':'<p class="sm-note">ยังไม่มีไฟล์สำหรับ '+esc(PLAT_TH[APP_PLATFORM])+' ในเวอร์ชันนี้</p>')+
          (APP_PLATFORM==='windows'&&l.portable?'<button class="btn line sm" type="button" data-dl="'+esc(l.portable.u)+'">แบบพกพา (portable)'+fmtMB(l.portable.s)+'</button>':'')+'</div>'+
          '<p class="sm-note">'+how+'</p></div>';
      }else if(s==='latest'&&l) box='<div class="stbox upd-ok">'+ico('check')+' ใช้เวอร์ชันล่าสุดแล้ว'+(l.ver?' ('+esc(l.ver)+(l.build?' รุ่น '+l.build:'')+')':'')+'</div>';
      else if(s==='err'||s==='norepo') box='<div class="stbox" style="border-color:var(--warn)">'+esc(Upd.err)+'</div>';
      const other=l&&s!=='wait'?[['แอป Android (.apk)',l.apk],['โปรแกรม Windows (Setup .exe)',l.exe],['Windows แบบพกพา',l.portable],['เว็บ (daily-report.html)',l.web]].filter(x=>x[1]):[];
      mb.innerHTML='<div class="ab-head"><img src="'+LOGO_FULL+'" alt=""><div><b>Daily Report</b><small>บันทึกควบคุมงานประจำวัน</small></div></div>'+
        '<div class="ab-ver"><div><small>เวอร์ชัน</small><b>'+esc(APP_VER)+'</b></div><div><small>รุ่น (build)</small><b>'+(APP_INFO.build||'—')+'</b></div><div><small>ใช้งานบน</small><b>'+esc(PLAT_TH[APP_PLATFORM])+'</b></div></div>'+
        box+
        '<button class="btn line block" id="abCheck" type="button"'+(s==='wait'?' disabled':'')+'>'+ico('refresh')+'ตรวจหาอัปเดตตอนนี้</button>'+
        (Upd.last?'<p class="sm-note">ตรวจล่าสุด '+new Date(Upd.last).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})+' · แอปตรวจให้เองเมื่อเปิดใช้งาน</p>':'<p class="sm-note">แอปตรวจหาอัปเดตให้เองเมื่อเปิดใช้งาน (เมื่อมีอินเทอร์เน็ต)</p>')+
        (other.length?'<details class="sy-admin"><summary>ไฟล์ทั้งหมดของเวอร์ชันล่าสุด (สำหรับติดตั้งเครื่องอื่น)</summary>'+other.map(x=>'<button type="button" class="btn ghost sm" data-dl="'+esc(x[1].u)+'">'+ico('dl')+esc(x[0])+fmtMB(x[1].s)+'</button>').join('')+'</details>':'');
      $('abCheck').onclick=async()=>{const p=Upd.check();draw();await p;draw()};
      mb.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>openExt(b.dataset.dl));
    };
    draw();
    if(Upd.st!=='wait'&&APP_INFO.repo&&Date.now()-Upd.last>60000){Upd.check().then(draw,draw);draw()}
  });
}

/* ============ เริ่มต้น ============ */
$('h-title').addEventListener('input',e=>{PF().docTitle=e.target.value;save()});
async function init(){
  let loaded=null; try{loaded=await dbGet('app'); if(loaded) loaded=cleanData(loaded)}catch(e){}
  if(loaded&&loaded.reports&&Object.keys(loaded.reports).length){
    app=loaded; const d=defaultProfile();
    app.profile={...d,...app.profile,sections:{...d.sections,...(app.profile||{}).sections},sigLabels:{...d.sigLabels,...((app.profile||{}).sigLabels||{})},sigs:{...d.sigs,...((app.profile||{}).sigs||{})}};
    app.profile.classic={...d.classic,...(app.profile.classic||{})};
    if(!app.profile._issuesOn){app.profile.sections.issues=true;app.profile._issuesOn=true}if(app.profile.lastBackup==null)app.profile.lastBackup='';
    Object.values(app.reports).forEach(r=>{if(r.inspect==null)r.inspect=''});
    migrateSigners();
    ['client','contractor'].forEach(k=>{const g=app.profile.sigs;if(g[k]&&!g[k+':0']){g[k+':0']=g[k]}delete g[k]});
    Object.values(app.projects).forEach(p=>{if(p.extra==null)p.extra=''});
    if(!app.reports[app.cur]) app.cur=Object.keys(app.reports)[0];
  }else{app=defaults();save()}
  $('h-title').value=PF().docTitle;
  applyFont();
  if(!PF().uiMode) PF().uiMode=(window.innerWidth>=980?'desktop':'mobile');
  buildChrome(); applyUiMode();
  renderForm();
  showView('home');
  setSt('ok','บันทึกอัตโนมัติ');
  wxApplyAll(); if(dzApplyAll()) save();
  askPersist();
  Sync.start();
  Upd.auto();
  const n=Object.keys(app.reports).length, lb=PF().lastBackup, days=lb?dayDiff(lb,todayS()):null;
  if(((!lb&&n>=3)||(lb&&days>=7))&&!Sync.user) setTimeout(()=>toast('ยังไม่ได้สำรองข้อมูล'+(lb?' มา '+days+' วัน':'')+' — กด “รายงาน” แล้วส่งออกไฟล์ .json ไว้'),1500);
}
init();
