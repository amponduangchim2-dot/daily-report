name: Build Android APK + Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      APP_VERSION: '1.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build www
        run: node scripts/build-www.mjs

      - name: Add Android project
        run: npx cap add android

      - name: Patch Android
        run: node scripts/patch-android.mjs

      - name: App icons
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#14304F' --iconBackgroundColorDark '#14304F'

      - name: Sync web into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "DailyReport-v${APP_VERSION}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DailyReport-v1.0-debug-apk
          path: DailyReport-v*-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DailyReport-v1.0-web-for-computer
          path: dist/daily-report.html

      - name: Build signed release APK
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: DailyReport-v1.0-release-apk
          path: android/app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest
    env:
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build www
        run: node scripts/build-www.mjs

      - name: Copy www to desktop
        run: |
          rm -rf desktop/www
          cp -r www desktop/www

      - name: Install Electron
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows exe
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: DailyReport-v1.0-windows-exe
          path: |
            desktop/release/DailyReport-Setup-1.0.exe
            desktop/release/DailyReport-1.0-portable.exe
